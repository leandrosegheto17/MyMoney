name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  base:
    name: base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Preparar pnpm e dependências
        uses: ./.github/actions/preparar-pnpm

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes (Vitest dos pacotes que não precisam de banco)
        # @mymoney/testes-api exige o Supabase local: roda no job isolamento.
        env:
          VITE_SUPABASE_URL: https://testes.invalid
          VITE_SUPABASE_ANON_KEY: chave-de-teste
        run: pnpm -r --if-present --filter '!@mymoney/testes-api' test

      - name: Teste do config.toml do Supabase
        run: pnpm run --if-present test:config

      - name: Shellcheck dos scripts de operação
        run: find backend/operacao backend/supabase -name '*.sh' -not -path '*/node_modules/*' -print0 | xargs -0 shellcheck -x

      - name: Testes dos scripts de deploy
        run: |
          bash backend/operacao/deploy/testes/migrar.test.sh
          bash backend/operacao/deploy/testes/migrar-job-migration.test.sh
          bash backend/operacao/deploy/testes/checar-aditiva.test.sh
          bash backend/operacao/deploy/testes/checar-aditiva.justificativa.test.sh
          bash backend/operacao/deploy/testes/checar-aditiva.literais.test.sh
          bash backend/operacao/deploy/testes/checar-aditiva.dollar-quote.test.sh
          bash backend/operacao/deploy/testes/checar-aditiva.sem-perl.test.sh
          bash backend/operacao/deploy/testes/checar-aditiva.falha-fechada.test.sh

      - name: Gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --redact --no-banner

      - name: Arquivo .sql fora de backend/supabase/
        run: |
          achados=$(git ls-files '*.sql' | grep -v '^backend/supabase/' || true)
          if [ -n "$achados" ]; then
            echo "::error::SQL fora de backend/supabase/:"
            echo "$achados"
            exit 1
          fi

      - name: ID de tarefa em backend/ ou frontend/
        run: |
          if achados=$(git grep -nE '(TP|RTP|SPK|BK)-[0-9]{4}' -- backend frontend); then
            echo "::error::ID de tarefa em código ou documentação de backend/ ou frontend/:"
            echo "$achados"
            exit 1
          fi

      - name: Chave de servico fora de .md/, .claude/, README e guarda de ambiente do web
        run: |
          if achados=$(git grep -n 'service[_]role' -- . ':!.md' ':!.claude' ':!**/README.md' ':!README.md' ':!frontend/web/src/configuracao/ambiente.ts' ':!frontend/web/src/configuracao/ambiente.test.ts'); then
            echo "::error::Chave de servico fora das áreas permitidas:"
            echo "$achados"
            exit 1
          fi

      - name: Credenciais de produção em .github/
        run: |
          if achados=$(git grep -nE 'SUPABASE_ACCESS[_]TOKEN|SUPABASE_DB[_]PASSWORD|PGPASS[W]ORD|service[_]role|postgres(ql)?://[^ ]+:[^ ]+@' -- .github); then
            echo "::error::Credencial de produção referenciada em .github/:"
            echo "$achados"
            exit 1
          fi

      - name: Nenhum segredo além de GITHUB_TOKEN
        run: |
          if achados=$(grep -nE 'secrets\.' .github/workflows/ci.yml | grep -vE 'secrets\.GITHUB_TOKEN'); then
            echo "::error::Segredo referenciado no workflow:"
            echo "$achados"
            exit 1
          fi

  banco:
    name: banco
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar pnpm e dependências
        uses: ./.github/actions/preparar-pnpm

      - name: Subir Supabase local e recriar o banco
        run: pnpm local:ci

      - name: Testes pgTAP
        run: pnpm exec supabase test db --workdir backend

      - name: Lint do banco
        run: pnpm exec supabase db lint --workdir backend --level error

      - name: Contrato de tipos em dia
        run: pnpm contrato:verificar

  isolamento:
    name: isolamento
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar pnpm e dependências
        uses: ./.github/actions/preparar-pnpm

      - name: Subir Supabase local e recriar o banco
        run: pnpm local:ci

      - name: Variáveis da suíte (só URL e chave anon locais)
        uses: ./.github/actions/ambiente-supabase-local

      - name: Suíte de isolamento da API
        run: pnpm --filter @mymoney/testes-api test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar pnpm e dependências
        uses: ./.github/actions/preparar-pnpm

      - name: Subir Supabase local e recriar o banco
        run: pnpm local:ci

      - name: Variáveis (só URL e chave anon locais)
        uses: ./.github/actions/ambiente-supabase-local

      - name: Build do web (typecheck e Vite)
        run: |
          export VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          pnpm --filter @mymoney/web build

      - name: Hosts externos no build
        run: pnpm --filter @mymoney/web verificar-hosts

      - name: Navegador do Playwright (Chromium)
        working-directory: frontend/web
        run: pnpm exec playwright install --with-deps chromium

      # Os specs fingem o Supabase (rotas interceptadas) e dependem do modo do Vite:
      # entrar, redefinir-senha e pwa (faz vite build, que recusa o modo de comparação) exigem o
      # app SEM modo de comparação; os demais, sessão falsa.
      # Os @integracao precisam de .env.local e de usuário semeado e ficam de fora.
      - name: e2e e axe sem sessão
        working-directory: frontend/web
        env:
          VITE_SUPABASE_URL: https://comparacao.invalid
          VITE_SUPABASE_ANON_KEY: chave-de-comparacao
        run: pnpm exec playwright test e2e/entrar.spec.ts e2e/redefinir-senha.spec.ts e2e/pwa.spec.ts

      - name: e2e e axe com sessão falsa
        working-directory: frontend/web
        env:
          VITE_MODO_COMPARACAO: sessao-falsa
          VITE_SUPABASE_URL: https://comparacao.invalid
          VITE_SUPABASE_ANON_KEY: chave-de-comparacao
        run: |
          specs=()
          for f in e2e/*.spec.ts; do
            case "$f" in e2e/entrar.spec.ts | e2e/redefinir-senha.spec.ts | e2e/pwa.spec.ts) ;; *) specs+=("$f") ;; esac
          done
          pnpm exec playwright test --grep-invert @integracao "${specs[@]}"

      - name: Comparação visual com o mockup
        run: pnpm --filter @mymoney/web visual

      - name: Prints da comparação visual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual
          path: .md/.visual/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          path: |
            frontend/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  integracao:
    name: integracao
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar pnpm e dependências
        uses: ./.github/actions/preparar-pnpm

      - name: Subir Supabase local e recriar o banco
        run: pnpm local:ci

      - name: Variáveis (só URL e chave anon locais)
        uses: ./.github/actions/ambiente-supabase-local

      - name: Navegador do Playwright (Chromium)
        working-directory: frontend/web
        run: pnpm exec playwright install --with-deps chromium

      - name: e2e de integração
        working-directory: frontend/web
        run: |
          export VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          pnpm exec playwright test --grep @integracao --pass-with-no-tests

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Base de comparação (main)
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$EVENT_BEFORE" ] && [ -n "${EVENT_BEFORE//0/}" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
          else
            base="origin/main"
          fi
          echo "MIGRATION_BASE=$base" >> "$GITHUB_ENV"

      - name: Checagem aditiva das migrations novas
        run: bash backend/operacao/deploy/checar-aditiva.sh "$MIGRATION_BASE"

      - name: Preparar pnpm e dependências
        uses: ./.github/actions/preparar-pnpm

      - name: Subir Supabase local
        run: pnpm local:ci

      - name: Ensaio das migrations novas sobre o seed de volume
        run: bash backend/operacao/deploy/ensaiar-migration.sh --base "$MIGRATION_BASE"
