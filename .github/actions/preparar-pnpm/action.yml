name: Preparar pnpm
description: pnpm na versão do packageManager, Node 24 com cache pnpm e dependências do lockfile.

runs:
  using: composite
  steps:
    - name: pnpm (versão do packageManager)
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Node com cache pnpm
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: pnpm

    - name: Instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile
