# Configuração do Supabase local. Fonte única dos valores que o painel de produção deve espelhar;
# a verificação automática está em verificacoes/config.test.mjs (pnpm test:config).

project_id = "mymoney"

[api]
enabled = true
port = 54321
# espelha o painel: Project Settings > API > Exposed schemas (só "api"; sem public nem
# graphql_public, o que também deixa o endpoint GraphQL sem schema exposto)
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = [
  "./schemas/app/schema.sql",
  "./schemas/api/schema.sql",
  "./schemas/privilegios_padrao.sql",
  "./schemas/app/tabelas/**/*.sql",
  "./schemas/app/**/*.sql",
  "./schemas/api/**/*.sql",
]

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
# espelha o painel: Authentication > Sessions > JWT expiry (3600 s)
jwt_expiry = 3600
# espelha o painel: Authentication > Sessions > Detect and revoke potentially compromised refresh tokens
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# espelha o painel: Authentication > Sign In / Providers > Allow new users to sign up (desligado)
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
# espelha o painel: Authentication > Sign In / Providers > Minimum password length
minimum_password_length = 12

[auth.email]
# espelha o painel: provedor de e-mail ligado; o cadastro fica fechado por `[auth] enable_signup = false` (ADR-014)
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
