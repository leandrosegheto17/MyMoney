        **Nova — BE-F3-01**, `supabase/functions/receipt-ocr/`. Extrai
        valor/data/estabelecimento/sugestão de categoria de uma foto de
        recibo, atrás da interface própria do produto `OCRProvider`
        (`supabase/functions/_shared/ocrProvider.ts`, DIR-22 — nunca amarrado
        ao formato de resposta nativo de um vendor específico). Vendor
        primário decidido em SPK-002 (TASK.md Seção 2): Google Cloud Vision
        (`DOCUMENT_TEXT_DETECTION`, texto bruto — o parsing de campo é
        heurística própria deste produto, `supabase/functions/receipt-ocr/lib.ts`,
        para formato de cupom fiscal brasileiro, não parsing nativo do vendor).

        Exige `Authorization: Bearer <JWT de sessão>` (usuário já logado —
        `verify_jwt` não desabilitado, mesmo padrão de `/webauthn-register`).
        **Não persiste nada** — puramente extração; a confirmação/persistência
        do lançamento é responsabilidade do fluxo de `candidate_transaction`
        (`BE-F3-00`) depois que o usuário confirmar os campos sugeridos no
        formulário (RF-F3-02 AC2). Corpo em JSON (`image_base64`/`mime_type`),
        não `multipart/form-data` — mesmo padrão de transporte de dado binário
        já usado por `/webauthn-register` (`attestationResponse`), mantém a
        chave do vendor (`GOOGLE_VISION_API_KEY`) só neste servidor
        (DIR-30/critério de aceite explícito desta tarefa: "chave de API nunca
        exposta ao cliente").

        **Campo obrigatório não extraído retorna em branco, nunca bloqueia os
        demais nem lança erro** (RF-F3-02 AC3, provado por
        `supabase/functions/receipt-ocr/lib.test.ts`, 20/20 casos PASS) — só
        uma falha total do vendor (rede/cota/chave inválida/imagem
        irreconhecível) produz um erro HTTP, mapeado para `502
        ocr_provider_failed`, sem nenhum dado parcial persistido (esta function
        nunca escreve no banco em nenhum caminho).

        **Ressalva de transparência (mesmo padrão de SPK-002/SEC-DEBT-009/
        Bloqueio 007/012)**: a integração real com a API do Google Cloud
        Vision foi implementada (chamada HTTP real, sem mock de produção), mas
        esta sessão não teve acesso a uma credencial real (`GOOGLE_VISION_API_KEY`)
        nem a uma amostra de recibo brasileiro real para smoke test empírico —
        cobertura de teste ficou nas camadas testáveis sem rede (parsing puro
        + `fetch` injetado simulando sucesso/falha do vendor). Pendência de
        configuração operacional: quem tiver a credencial (dono: Backend, sem
        prazo fixo) precisa rodar `supabase secrets set GOOGLE_VISION_API_KEY=<chave>`
        no projeto linkado antes desta function funcionar em produção — sem a
        secret configurada, responde `503 ocr_not_configured` de forma
        controlada, nunca finge sucesso. Mesma recomendação de SPK-002: testar
        manualmente com 10-20 recibos reais (papel térmico incluso) antes de
        considerar a acurácia de produção validada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_base64, mime_type]
              properties:
                image_base64:
                  type: string
                  description: "Conteúdo da imagem, base64 padrão (não url-safe)."
                mime_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
      responses:
        "200":
          description: "Extração concluída (mesmo quando um ou mais campos vêm em branco — AC3)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: "ReceiptExtractionResult (supabase/functions/_shared/ocrProvider.ts)."
                    properties:
                      amount_cents: { type: object, nullable: true, properties: { value: { type: integer }, confidence: { type: number } } }
                      transaction_date: { type: object, nullable: true, properties: { value: { type: string, format: date }, confidence: { type: number } } }
                      merchant_name: { type: object, nullable: true, properties: { value: { type: string }, confidence: { type: number } } }
                      category_suggestion_label: { type: object, nullable: true, properties: { value: { type: string }, confidence: { type: number } } }
                      overall_confidence: { type: number, nullable: true }
                      raw_text: { type: string, nullable: true }
        "400":
          description: "image_base64 ausente/inválido, mime_type fora da lista permitida, ou imagem maior que o limite (8MB decodificado)."
        "401": { description: "JWT ausente/inválido/expirado." }
        "502": { description: "ocr_provider_failed — falha total do vendor (rede/cota/chave inválida/imagem irreconhecível). Nada é persistido." }
        "503": { description: "ocr_not_configured (GOOGLE_VISION_API_KEY não configurada — ver ressalva acima) ou auth_unavailable (Auth indisponível ao validar a sessão)." }

  /voice-capture:
    post:
      summary: "Extração de campos de captura por voz a partir de transcrição (RF-F3-01 AC1, ADR-006 — BE-F3-02)"
      tags: [Captura Automatizada]
      servers:
        - url: https://xrcxbzrglndetrrhavhc.supabase.co/functions/v1
          description: Edge Functions
      description: >-
        **Nova — BE-F3-02**, `supabase/functions/voice-capture/`. Recebe a
        transcrição já produzida pelo client via Web Speech API (camada
        obrigatória de ADR-006, opção B) e extrai valor, data, tipo
        (entrada/saída), descrição sugerida e categoria sugerida via
        heurísticas de linguagem natural pt-BR próprias do produto
        (`supabase/functions/voice-capture/lib.ts`), sem depender do formato
        nativo de nenhum vendor.

        Aceita, alternativamente, `audio_base64`/`mime_type` para acionar um
        fallback de STT em nuvem — ADR-006 decide explicitamente que esse
        fallback é extensão futura, sem vendor escolhido/configurado no
        início da Fase 3 (`supabase/functions/_shared/sttProvider.ts`,
        `getConfiguredSTTProvider()` retorna `null` até um novo ADR resolver
        o vendor). Sem vendor configurado, essa via responde `503
        stt_fallback_not_configured` de forma controlada, nunca finge
        sucesso. Quando ambos os campos chegam no corpo, `transcript` tem
        prioridade (evita acionar STT em nuvem à toa quando o client já
        transcreveu com sucesso).

        Exige `Authorization: Bearer <JWT de sessão>` (usuário já logado —
        `verify_jwt` não desabilitado, mesmo padrão de
        `/webauthn-register`/`/receipt-ocr`). **Não persiste nada** —
        puramente extração; a confirmação/persistência do lançamento é
        responsabilidade do fluxo de `candidate_transaction` (`BE-F3-00`)
        depois que o usuário confirmar os campos sugeridos no formulário
        (RF-F3-01 AC2). Todo campo extraído é literalmente marcado como
        `"sugestão automática, não confirmada"` via
        `result.suggestion_disclaimer` (RF-F3-01 AC1), além da semântica já
        implícita do padrão `{ value, confidence }` por campo (mesmo formato
        de `ReceiptExtractionResult`) e do próprio fluxo de confirmação
        humana de `candidate_transaction`.

        **Campo não reconhecido na fala retorna em branco, nunca bloqueia os
        demais nem lança erro** — mesmo princípio de AC3 de RF-F3-02,
        aplicado aqui por consistência de produto (provado por
        `supabase/functions/voice-capture/lib.test.ts`, 27/27 casos PASS).
        `transaction_date` é a única exceção: na ausência de qualquer menção
        de data reconhecível, assume "hoje" com confiança reduzida (0.4) em
        vez de ficar em branco — decisão de interpretação pequena e
        documentada no próprio código (`lib.ts`), já que a captura por voz é,
        na prática esmagadora dos casos, sobre um gasto que acabou de
        acontecer; o campo continua editável livremente antes de confirmar
        (RF-F3-01 AC3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Envie `transcript` OU (`audio_base64` + `mime_type`) — pelo
                menos um dos dois é obrigatório. `transcript` tem prioridade
                quando ambos chegam.
              properties:
                transcript:
                  type: string
                  maxLength: 2000
                  description: "Transcrição já produzida pelo client via Web Speech API."
                audio_base64:
                  type: string
                  description: "Áudio para fallback de STT em nuvem, base64 padrão (não url-safe). Só usado quando transcript está ausente."
                mime_type:
                  type: string
                  enum: [audio/webm, audio/ogg, audio/wav, audio/mp4]
                  description: "Obrigatório junto de audio_base64."
      responses:
        "200":
          description: "Extração concluída (mesmo quando um ou mais campos vêm em branco)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: "VoiceExtractionResult (supabase/functions/voice-capture/lib.ts)."
                    properties:
                      amount_cents: { type: object, nullable: true, properties: { value: { type: integer }, confidence: { type: number } } }
                      transaction_date: { type: object, properties: { value: { type: string, format: date }, confidence: { type: number } } }
                      type: { type: object, nullable: true, properties: { value: { type: string, enum: [entrada, saida] }, confidence: { type: number } } }
                      description: { type: object, nullable: true, properties: { value: { type: string }, confidence: { type: number } } }
                      category_suggestion_label: { type: object, nullable: true, properties: { value: { type: string }, confidence: { type: number } } }
                      transcript: { type: string }
                      suggestion_disclaimer:
                        type: string
                        description: "Sempre \"sugestão automática, não confirmada\" (RF-F3-01 AC1, texto literal)."
        "400":
          description: "missing_input (nem transcript nem audio_base64 enviados), transcript_too_long (>2000 caracteres), invalid_mime_type, invalid_base64, ou audio_too_large (>8MB decodificado)."
        "401": { description: "JWT ausente/inválido/expirado." }
        "502": { description: "stt_provider_failed — falha total do vendor de fallback (quando configurado). Nada é persistido." }
        "503": { description: "stt_fallback_not_configured (nenhum vendor de STT em nuvem configurado, ADR-006) ou auth_unavailable (Auth indisponível ao validar a sessão)." }

  /statement-import:
    post:
      summary: "Interpretação de extrato bancário OFX/CSV + detecção de possível duplicata (RF-F3-03 AC1-3 — BE-F3-03)"
      tags: [Captura Automatizada]
      servers:
        - url: https://xrcxbzrglndetrrhavhc.supabase.co/functions/v1
          description: Edge Functions
      description: >-
        **Nova — BE-F3-03**, `supabase/functions/statement-import/`.
        Interpreta um arquivo de extrato bancário OFX ou CSV
        (`supabase/functions/statement-import/lib.ts`, parser próprio deste
        produto — OFX via extração de blocos `<STMTTRN>` por regex, tolerante
        a SGML "solto"/tags não fechadas comuns em extratos reais de banco;
        CSV com cabeçalho pt-BR/en reconhecido por nome de coluna, já que
        `SDD.md` não define um layout único — não existe padrão de fato entre
        bancos) e devolve uma lista de transações candidatas normalizadas,
        cada uma já no formato de `NewCandidateTransaction`
        (`source=import`, `BE-F3-00`), pronta para o Frontend criar via
        `POST /import_batch` + `POST /candidate_transaction` depois que o
        usuário revisar/selecionar a lista (RF-F3-03 AC1) — reuso explícito
        do mesmo fluxo de candidatos/revisão de voz e foto (FL-05), não um
        mecanismo de persistência paralelo.

        **Detecção de possível duplicata (RF-F3-03 AC2)**: cada candidata é
        comparada contra os lançamentos JÁ existentes do usuário na
        `account_id` informada — mesma `transaction_date` E mesmo
        `amount_cents` sinaliza `duplicate_of_transaction_id` com o `id` do
        lançamento existente (nunca bloqueia a candidata, só informa; o
        Frontend decide a UI de "vem desmarcado por padrão", `FE-F3-05`).
        Única leitura ao banco feita por esta function: `SELECT id,
        transaction_date, amount_cents FROM transactions WHERE account_id =
        :account_id AND transaction_date BETWEEN :min AND :max`, via cliente
        com o JWT do próprio usuário (RLS aplicada — nunca `service_role`).
        Falha nessa consulta específica não derruba a resposta — degrada para
        "nenhuma duplicata sinalizada nesta resposta" (logada como erro para
        investigação), já que apresentar a lista de candidatos (AC1) não deve
        depender de uma query auxiliar funcionar.

        Exige `Authorization: Bearer <JWT de sessão>` (usuário já logado —
        `verify_jwt` não desabilitado, mesmo padrão de `/receipt-ocr`/
        `/voice-capture`). **Não persiste nada em `import_batch` nem
        `candidate_transaction`** — mesmo princípio de "pura extração, sem
        efeito colateral" de `/receipt-ocr`/`/voice-capture`, aplicado aqui a
        um arquivo inteiro em vez de um campo único; a única leitura ao banco
        é a checagem de duplicata acima, nunca uma escrita (AC1/AC3 — nenhuma
        persistência definitiva antes da revisão/confirmação do usuário).
        Corpo em JSON (`file_content_base64`/`file_format`/`account_id`), não
        `multipart/form-data` — mesmo padrão de transporte de dado binário já
        usado por `/receipt-ocr`/`/voice-capture`.

        **Linha malformada nunca derruba o arquivo inteiro nem lança erro**
        (AC3, mesmo princípio de AC3 de RF-F3-02/RF-F3-01, provado por
        `supabase/functions/statement-import/lib.test.ts`, 23/23 casos PASS)
        — um registro OFX sem `DTPOSTED`/`TRNAMT` reconhecível, ou uma linha
        de CSV com data/valor inválido, é pulada e contada em
        `skipped_lines`; as demais continuam normalmente. Só quando NENHUMA
        transação é reconhecida no arquivo inteiro (arquivo vazio, formato
        errado, ou cabeçalho de CSV sem colunas de data/valor reconhecíveis)
        a resposta vira `422 unprocessable_file` — fallback gracioso, nunca
        um crash da function.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_content_base64, file_format, account_id]
              properties:
                file_content_base64:
                  type: string
                  description: "Conteúdo do arquivo OFX/CSV, base64 padrão (não url-safe). Máx. 5MB decodificado."
                file_format:
                  type: string
                  enum: [ofx, csv]
                account_id:
                  type: string
                  format: uuid
                  description: "Conta contra a qual as transações candidatas serão comparadas na checagem de duplicata (AC2) — mesma conta usada depois na confirmação."
      responses:
        "200":
          description: "Arquivo interpretado (mesmo quando skipped_lines > 0 — AC3)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    description: "NewCandidateTransaction[] pronto para POST /candidate_transaction (source sempre \"import\"), não persistido por esta function."
                    items:
                      type: object
                      properties:
                        source: { type: string, enum: [import] }
                        raw_payload:
                          type: object
                          properties:
                            transaction_date: { type: string, format: date }
                            amount_cents: { type: integer }
                            kind: { type: string, enum: [income, expense] }
                            description: { type: string, nullable: true }
                            external_ref: { type: string, nullable: true, description: "FITID (OFX) ou \"csv:<linha>\" (CSV) — só rastreabilidade, nunca usado na detecção de duplicata." }
                        duplicate_of_transaction_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: "RF-F3-03 AC2 — preenchido quando existe lançamento com mesma transaction_date+amount_cents na account_id informada."
                  total_parsed: { type: integer }
                  skipped_lines: { type: integer, description: "Linhas/registros que não puderam ser interpretados e foram pulados (AC3) — nunca derruba as demais." }
                  duplicate_count: { type: integer }
        "400":
          description: "missing_file/invalid_base64 (file_content_base64 ausente/inválido), file_too_large (>5MB decodificado), invalid_file_format (fora de ofx/csv), missing_account_id/invalid_account_id (não é uuid)."
        "401": { description: "JWT ausente/inválido/expirado." }
        "422": { description: "unprocessable_file — nenhuma transação reconhecível no arquivo inteiro (AC3, fallback gracioso). Nada é persistido." }
        "503": { description: "auth_unavailable — Auth indisponível ao validar a sessão." }

  /data-retention-purge:
    post:
      summary: "Job diário de expurgo de dado transitório — endpoint interno/operacional, NUNCA consumido por Frontend/Mobile (BE-F3-08, ADR-011, DIR-31/32)"
      tags: [Retenção & Descarte de Dado]
      servers:
        - url: https://xrcxbzrglndetrrhavhc.supabase.co/functions/v1
          description: Edge Functions
      security: []
      description: >-
        **Nova — BE-F3-08**, `supabase/functions/data-retention-purge/`,
        migrations `20260909120000_be_f3_08_data_retention_purge_jobs.sql` e
        `20260909121000_be_f3_08_revoke_execute_purge_functions.sql`. Dispara
        **exclusivamente** por `pg_cron` via `pg_net`
        (`public.trigger_data_retention_purge()`, diário às 03:30 UTC;
        `public.check_data_retention_health()`, a cada 6h), nunca por client
        autenticado — mesmo padrão de `/backup-export` (BE-M-10): sem
        `verify_jwt` (`--no-verify-jwt`), autenticação por segredo
        compartilhado no header `X-Cron-Secret` (fail-closed). Verificado
        antes de implementar (`DIR-33`): `supabase functions list` não mostrou
        nenhuma function de expurgo/retenção pré-existente.

        Roda 2 sub-jobs, cada um logado individualmente em
        `public.data_retention_purge_log` (DIR-32), falha de um não impede o
        outro: (1) `candidate_transaction_purge` — via RPC
        `purge_expired_candidate_transactions` (SECURITY DEFINER,
        `EXECUTE` restrito a `service_role`), remove `CandidateTransaction`
        descartado há mais de 30 dias ou pending sem ação há mais de 30 dias
        desde a criação do `ImportBatch` associado (ou do próprio
        `created_at`, para candidato avulso de voz/foto sem lote); (2)
        `export_purge` — via RPC `list_expired_export_objects` (mesma
        restrição de `EXECUTE`) + `storage.from('exports').remove(...)`,
        remove objeto do bucket `exports` (BE-F3-07) criado há mais de 24h.

        **Resolução do Bloqueio 024 (`BLOCKERS.md`, Resolvido) —** um 3º
        sub-job (`confirmed_receipt_photo_purge`) existiu nesta function como
        um "skip" registrado (`status: skipped_not_implemented`) enquanto a
        decisão de arquitetura sobre persistência de foto de recibo estava
        pendente. `ADR-020` formalizou, como decisão definitiva do
        stakeholder, que foto de recibo **nunca será persistida** — as 2
        linhas de retenção de foto de `ADR-011` (90 dias/lançamento
        confirmado, 30 dias/candidato descartado) ficam sem objeto por
        decisão de produto, não por lacuna de implementação. O 3º sub-job foi
        removido por completo (não existe mais nem como skip); os 2 sub-jobs
        acima cobrem 100% do que de fato precisa ser expurgado.
      parameters:
        - in: query
          name: mode
          schema: { type: string, enum: [healthcheck] }
          required: false
          description: "Omitido = executa os 2 sub-jobs de expurgo. `healthcheck` = só verifica staleness (>26h) de candidate_transaction_purge/export_purge e alerta, sem expurgar."
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: "Todos os sub-jobs implementados rodaram com sucesso (purge), ou healthcheck executado (independente de stale_jobs)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  results:
                    type: array
                    nullable: true
                    description: "só no modo purge — 1 entrada por sub-job"
                    items:
                      type: object
                      properties:
                        job_name: { type: string, enum: [candidate_transaction_purge, export_purge] }
                        status: { type: string, enum: [success, failure] }
                        detail: { type: object }
                        error_message: { type: string, nullable: true }
                  stale_jobs:
                    type: array
                    nullable: true
                    description: "só no modo healthcheck"
                    items: { type: string }
        "401":
          description: "X-Cron-Secret ausente, incorreto, ou não configurado no ambiente da função (fail-closed)."
        "500":
          description: "Ao menos um sub-job falhou — sempre logado em data_retention_purge_log e reportado por e-mail de alerta (best-effort)."

