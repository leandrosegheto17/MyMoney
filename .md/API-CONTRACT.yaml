openapi: 3.0.3
info:
  title: MyMoney API (Supabase PostgREST + RPCs + Edge Functions)
  version: "0.27.0"
  description: |
    Contrato publicado incrementalmente pelo Backend, por endpoint, assim que fica
    estável — sem esperar a tarefa inteira terminar (ver `.claude/agents/backend.md`).
    Toda mudança em um endpoint já publicado é feita como nova versão visível nesta
    changelog, nunca silenciosamente.

    **Arquitetura**: não há servidor de aplicação dedicado (DIR-07/G-14). A grande
    maioria dos endpoints abaixo é a API REST **auto-gerada pelo PostgREST** do
    Supabase a partir do schema `public` (`ADR-012`) — CRUD simples é modelado
    inteiramente via tabela + RLS + trigger (nunca reimplementado em Edge Function).
    RPCs (`/rest/v1/rpc/<nome>`) expõem funções SQL para lógica de agregação
    (dashboard) ou de segurança que não deve ficar só no client. Edge Functions
    (`/functions/v1/<nome>`) só existem para lógica que exige cripto/verificação
    fora do alcance do SQL puro (ex.: verificação de assertion WebAuthn).

    **Autenticação**: todo endpoint abaixo (exceto os do próprio Supabase Auth)
    exige header `Authorization: Bearer <JWT de sessão>` — RLS aplicada por
    `auth.uid()`. As 4 tabelas com gate adicional de MFA
    (`accounts`, `categories`, `payment_methods`, `transactions`) também exigem
    que o JWT carregue o claim `app_email_mfa_verified = "true"`
    (`custom_access_token_hook`, ver ADR-013) — sem isso, toda operação nessas 4
    tabelas retorna 403 (RLS nega a linha), mesmo com JWT válido.

    **Convenção de erro (PostgREST)**: violação de `CHECK`/regra de negócio
    embutida em trigger é sinalizada com `errcode` Postgres classe `23` (integrity
    constraint violation), que o PostgREST mapeia para **HTTP 409 Conflict**, corpo
    `{ "code": "<sqlstate>", "message": "<detalhe>" }`. Campo obrigatório ausente
    retorna **HTTP 400**. RLS negando acesso (linha de outro usuário, ou MFA não
    verificado) retorna **HTTP 403** (ou 404, dependendo do método — PostgREST não
    distingue "não existe" de "não autorizado" por padrão, propositalmente, para
    não vazar existência de dado de outro usuário).
  contact:
    name: Backend (MyMoney pipeline)
servers:
  - url: https://xrcxbzrglndetrrhavhc.supabase.co/rest/v1
    description: PostgREST (tabelas + RPCs)
  - url: https://xrcxbzrglndetrrhavhc.supabase.co/functions/v1
    description: Edge Functions
  - url: https://xrcxbzrglndetrrhavhc.supabase.co/auth/v1
    description: Supabase Auth (GoTrue) — e-mail/senha, magic link

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: "23001" }
        message: { type: string }
        details: { type: string, nullable: true }
        hint: { type: string, nullable: true }

    Account:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        type: { type: string, enum: [checking, savings, wallet, investment] }
        currency: { type: string, example: "BRL" }
        initial_balance_cents: { type: integer, format: int64 }
        current_balance_cents: { type: integer, format: int64, readOnly: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        is_active: { type: boolean, default: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [name, type, currency, initial_balance_cents]

    PaymentMethod:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        account_id: { type: string, format: uuid, nullable: true }
        credit_card_id: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [pix, debit_card, credit_card, boleto, cash] }
        name: { type: string }
        is_active: { type: boolean, default: true }
        is_system_default:
          type: boolean
          readOnly: true
          description: >-
            true para as 4 formas padrão (Pix/Débito/Boleto/Dinheiro) semeadas
            automaticamente na 1ª conta do usuário (BE-M-02) — não editável/excluível
            (PATCH/DELETE retornam 403 via RLS). "Crédito" (type=credit_card) é
            sempre false — é gerada 1 por CreditCard cadastrado (BE-F2-01), objeto
            gerenciado pelo próprio usuário, não um valor fixo do sistema.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [type, name]

    Category:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, nullable: true, readOnly: true, description: "null = categoria padrão do sistema, visível a todos os usuários" }
        parent_category_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        kind: { type: string, enum: [income, expense] }
        is_system_default: { type: boolean, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [name, kind]

    CreditCard:
      type: object
      description: >-
        RF-F2-01 (BE-F2-01). Ao criar um cartão, o sistema gera automaticamente
        (trigger `credit_cards_after_insert_seed_payment_method`) um `PaymentMethod`
        com `type=credit_card` e `credit_card_id` apontando para este cartão — o
        client não precisa (e não deve) criar esse PaymentMethod manualmente.
        Limite disponível: ver `GET /rpc/get_credit_cards_available_limit`
        (BE-F2-02, RN-06). Faturas: ver `GET /invoices` (BE-F2-02).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        name: { type: string, description: "apelido do cartão, ex. \"Nubank\" — também usado como name do PaymentMethod derivado" }
        limit_cents: { type: integer, format: int64, minimum: 1 }
        closing_day: { type: integer, minimum: 1, maximum: 31 }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        is_active: { type: boolean, default: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [name, limit_cents, closing_day, due_day]

    Invoice:
      type: object
      description: >-
        RF-F2-05/BE-F2-02. Somente leitura na prática: `status` só é escrito
        pelo job periódico `close_due_invoices` (SECURITY DEFINER) — não há
        policy de UPDATE/DELETE para `authenticated`, PATCH/DELETE retornam
        404/403 (RLS nega, PostgREST não encontra linha para o client). O
        client nunca cria fatura diretamente: `credit_card_invoice_id` de cada
        `Transaction` é resolvido automaticamente pelo servidor no momento do
        lançamento (RN-01).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        credit_card_id: { type: string, format: uuid }
        competencia: { type: string, format: date, description: "sempre o 1º dia do mês da fatura, ex. 2026-09-01" }
        status:
          type: string
          enum: [aberta, fechada]
          readOnly: true
          description: "aberta = ainda recebe lançamento; fechada = ciclo encerrado (RF-F2-05 AC3). Não confundir com fatura paga — não há esse estado no modelo (ver RN-06)."
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    RecurringTemplate:
      type: object
      description: >-
        RF-F2-02 (BE-F2-03). Gera automaticamente 1 Transaction por competência
        (job diário, idempotente) enquanto start_date <= hoje <= (end_date ou
        infinito). "end_date" é como o client encerra a recorrência (RF-F2-02
        AC2) — nunca DELETE se quiser preservar o histórico visível na própria
        entidade; DELETE também é permitido (RN-07 garante que os lançamentos
        já gerados não são apagados, só perdem o vínculo — recurring_rule_id
        vira NULL). **BE-F2-04**: `amount_cents` é só o valor ORIGINAL (desde
        `start_date`) e é **imutável após a criação** — PATCH tentando mudá-lo
        retorna 400 (trigger rejeita). Reajuste prospectivo é sempre via
        `POST /recurring_template_adjustments`, nunca via PATCH aqui.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        description: { type: string }
        amount_cents: { type: integer, format: int64, minimum: 1, description: "imutável após a criação (BE-F2-04) — ver RecurringTemplateAdjustment para reajuste" }
        category_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        payment_method_id: { type: string, format: uuid }
        day_of_month: { type: integer, minimum: 1, maximum: 31, description: "clampado ao último dia do mês quando o mês tiver menos dias (ex. 31 em abril gera dia 30)" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true, description: "RF-F2-02 AC2 — null = recorrência sem fim definido" }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [description, amount_cents, category_id, account_id, payment_method_id, day_of_month, start_date]

    RecurringTemplateAdjustment:
      type: object
      description: >-
        RF-F2-03/RN-02 (BE-F2-04). 1 linha = "a partir desta competência, o
        valor deste RecurringTemplate passa a ser este" — histórico completo,
        nunca sobrescreve linha anterior. `effective_from` não pode ser
        anterior ao mês corrente (400 — reajuste é sempre prospectivo, nunca
        retroativo a lançamento já gerado). Só 1 reajuste por (template,
        competência) — usar PATCH/DELETE no próprio reajuste para corrigir um
        já cadastrado antes de valer.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        recurring_template_id: { type: string, format: uuid }
        effective_from: { type: string, format: date, description: "sempre o 1º dia do mês de competência; mínimo o mês corrente" }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [recurring_template_id, effective_from, amount_cents]

    InstallmentPurchase:
      type: object
      description: >-
        RF-F2-04 (BE-F2-05). Gera automaticamente 1 Transaction por fatura
        (mesmo job diário de RecurringTemplate, reaproveitado — Recorrência e
        Parcelamento são o mesmo bounded context) até completar
        installments_count parcelas, cada parcela na competência calculada
        por RN-01 (mesma função de BE-F2-02) a partir de purchase_date + N
        meses. `total_amount_cents` é sempre o valor TOTAL da compra — se o
        usuário digitar "por parcela", o client multiplica por
        installments_count antes de enviar (mesmo racional de
        RecurringTemplate.amount_cents, evita 2 campos mutuamente
        exclusivos). `payment_method_id` precisa ser uma forma type=credit_card
        (400 caso contrário). `total_amount_cents`/`installments_count`/
        `purchase_date`/`payment_method_id` ficam **imutáveis assim que a 1ª
        parcela já foi gerada** (400 numa tentativa de PATCH desses 4 campos)
        — description/category_id/account_id continuam sempre editáveis. Ver
        `GET /rpc/get_installment_purchases_progress` para "parcela X de N"
        (AC2).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        description: { type: string }
        total_amount_cents: { type: integer, format: int64, minimum: 1 }
        installments_count: { type: integer, minimum: 2 }
        category_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        payment_method_id: { type: string, format: uuid, description: "deve referenciar uma forma de pagamento type=credit_card" }
        purchase_date: { type: string, format: date }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [description, total_amount_cents, installments_count, category_id, account_id, payment_method_id, purchase_date]

    FixedBill:
      type: object
      description: >-
        RF-F2-06 (BE-F2-06). Gera automaticamente 1 Transaction "previsto"
        (status=pending) por competência, assim que o mês começa — não
        espera o due_day chegar, é uma previsão (dá margem para RF-F2-07,
        aviso 3 dias antes, ainda não implementado). "Marcar como paga"
        (AC2) não é um endpoint próprio: é PATCH
        `/transactions?id=eq.{transaction_id}` com `{"status":"cleared"}` na
        Transaction gerada — já funciona com o contrato existente, sem campo
        novo (o saldo já reflete o lançamento desde a criação,
        independente do status). "end_date" encerra sem excluir, mesmo
        padrão de RecurringTemplate/InstallmentPurchase.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        description: { type: string }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        category_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        payment_method_id: { type: string, format: uuid }
        due_day: { type: integer, minimum: 1, maximum: 31, description: "clampado ao último dia do mês quando o mês tiver menos dias" }
        alert_days_before: { type: integer, minimum: 0, maximum: 30, default: 3, description: "RN-05 (BE-F2-07) — dias corridos de antecedência do aviso de vencimento, configurável por conta fixa" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [description, amount_cents, category_id, account_id, payment_method_id, due_day, start_date]

    PushSubscription:
      type: object
      description: >-
        RF-F2-09 (BE-F2-09). 1 linha por dispositivo/navegador inscrito em
        Web Push (resultado de `PushManager.subscribe()` no client). Sem
        gate de MFA — inscrever/desinscrever push é ação de baixo risco, não
        é dado financeiro.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        endpoint: { type: string, description: "URL do push service, única por inscrição" }
        p256dh: { type: string }
        auth_key: { type: string }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [endpoint, p256dh, auth_key]

    Notification:
      type: object
      description: >-
        RF-F2-09 AC2 (BE-F2-09). Histórico de notificação, consultável no
        app independente de o push ter sido entregue (DIR-14). Só
        `notify_user()` (SECURITY DEFINER) cria — POST direto não é
        permitido (403/404, sem policy de INSERT para authenticated). PATCH
        só serve pra marcar como lida (`read_at`).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        type: { type: string, enum: [budget_alert, fixed_bill_due], readOnly: true }
        message: { type: string, readOnly: true }
        related_entity_type: { type: string, nullable: true, readOnly: true, description: "'budget_warning'/'budget_exceeded' ou 'fixed_bill'" }
        related_entity_id: { type: string, format: uuid, nullable: true, readOnly: true }
        read_at: { type: string, format: date-time, nullable: true, description: "único campo escrevível pelo client — marcar como lida" }
        created_at: { type: string, format: date-time, readOnly: true }

    Goal:
      type: object
      description: >-
        RF-F2-08 (BE-F2-08). Meta de economia com aportes vinculados
        (Contribution). Progresso (valor atual/percentual) não é campo desta
        entidade — é sempre calculado ao vivo por
        `POST /rpc/get_goals_progress` (nunca uma coluna cacheada aqui, ver
        essa RPC). "is_active" permite arquivar/pausar sem excluir (decisão
        física do Backend — RF-F2-08 AC2 fala em "meta ativa").
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        target_amount_cents: { type: integer, format: int64, minimum: 1 }
        target_date: { type: string, format: date, nullable: true }
        is_active: { type: boolean, default: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [name, target_amount_cents]

    Contribution:
      type: object
      description: >-
        RF-F2-08 AC1 (BE-F2-08). Aporte vinculado a uma Goal (valor, data).
        Não é uma Transaction — não afeta saldo de conta nem aparece no
        ledger (decisão física do Backend, alinhada a UX-FL-15/S-GOAL-03,
        que trata "registrar aporte" como ação própria da tela de metas).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        goal_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, readOnly: true }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        contribution_date: { type: string, format: date, description: "default: hoje" }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [goal_id, amount_cents]

    Budget:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        category_id: { type: string, format: uuid }
        month: { type: string, format: date, description: "sempre o 1º dia do mês de competência, ex. 2026-09-01" }
        limit_cents: { type: integer, format: int64 }
        alert_threshold_pct: { type: integer, default: 80, minimum: 1, maximum: 100 }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [category_id, month, limit_cents]

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        account_id:
          type: string
          format: uuid
          description: >-
            **Novo — BE-REF-04 (RN-16, ADR-016 Decisão 3/6).** Opcional no
            payload quando payment_method_id é enviado e kind != transfer —
            resolvido automaticamente pelo servidor (trigger
            transactions_default_account_from_payment_method): forma
            não-cartão resolve para a conta vinculada de payment_method_id;
            forma type=credit_card resolve para a conta ativa mais antiga do
            usuário (comportamento já observado hoje, preservado). Continua
            **obrigatório** quando kind=transfer (transferência não usa
            payment_method_id, fora de escopo de RF-REF-04). Enviar
            explicitamente continua aceito e nunca é sobrescrito pelo
            servidor (RecurringTemplate/InstallmentPurchase/FixedBill, Fase 2,
            continuam enviando sempre explícito, inalterados).
        destination_account_id: { type: string, format: uuid, nullable: true, description: "obrigatório e diferente de account_id quando kind=transfer" }
        payment_method_id: { type: string, format: uuid, nullable: true, description: "obrigatório quando kind != transfer" }
        category_id: { type: string, format: uuid, nullable: true, description: "obrigatório quando kind != transfer" }
        card_invoice_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >-
            **Novo — BE-F2-02.** Resolvido automaticamente pelo servidor quando
            payment_method_id aponta para uma forma de pagamento type=credit_card
            (RN-01/RF-F2-05 AC2) — nunca aceito do client, mesmo padrão de
            "status". NULL quando o meio de pagamento não é cartão.
        recurring_rule_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >-
            **Novo — BE-F2-03.** Preenchido só nos lançamentos gerados
            automaticamente por generate_recurring_transactions (RF-F2-02
            AC1) — nunca aceito do client (lançamento manual normal via POST
            sempre tem este campo NULL). Vira NULL se o RecurringTemplate de
            origem for excluído (RN-07: o lançamento em si nunca é apagado).
        installment_plan_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >-
            **Novo — BE-F2-05.** Preenchido só nas parcelas geradas
            automaticamente por generate_installment_transactions (RF-F2-04
            AC1) — nunca aceito do client. Vira NULL se o InstallmentPurchase
            de origem for excluído (RN-07, mesmo padrão de recurring_rule_id).
        installment_number:
          type: integer
          nullable: true
          readOnly: true
          description: "Novo — BE-F2-05. 1-indexed; junto com installments_count do InstallmentPurchase referenciado, forma o \"parcela X de N\" (RF-F2-04 AC2)."
        fixed_bill_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >-
            **Novo — BE-F2-06.** Preenchido só nos lançamentos "previsto"
            gerados automaticamente por generate_fixed_bill_transactions
            (RF-F2-06 AC1) — nunca aceito do client. "Marcar como paga" é
            PATCH desta MESMA Transaction (status=cleared), não um campo
            aqui. Vira NULL se a FixedBill de origem for excluída (RN-07).
        kind: { type: string, enum: [income, expense, transfer] }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        description: { type: string, nullable: true }
        transaction_date: { type: string, format: date }
        status:
          type: string
          enum: [pending, cleared, reconciled]
          readOnly: true
          description: >-
            Definido automaticamente pelo trigger `transactions_before_insert_set_status`:
            'pending' se transaction_date > hoje (America/Sao_Paulo), 'cleared' caso
            contrário. Transições pending→cleared automáticas rodam a cada 15min via
            pg_cron (`fn_clear_due_transactions`). O saldo da conta já reflete o
            lançamento imediatamente na criação, independente do status (achado de
            auditoria, AUDITORIA-BE-M-00.md Seção 4).
        source:
          type: string
          enum: [manual, audio, ocr, import, openfinance]
          default: manual
          description: "MVP só usa 'manual'; demais valores reservados para Fase 3."
        import_staging_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >-
            **Novo — BE-F3-00.** Preenchido só nos lançamentos gerados por
            `POST /rpc/confirm_candidate_transaction` (RF-F3-01/02/03/04) —
            nunca aceito do client em POST/PATCH direto de /transactions.
            Aponta para o `CandidateTransaction` (`candidate_transaction.id`)
            que originou este lançamento. Vira NULL se o candidato de origem
            for excluído (ON DELETE SET NULL, mesmo princípio de RN-07 para
            recurring_rule_id/installment_plan_id — nunca apaga o lançamento
            já confirmado).
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            **Novo — BE-F3-00 (RNF-08).** Timestamp do evento de confirmação
            humana explícita, gravado exclusivamente por
            `confirm_candidate_transaction` — nunca aceito do client. NULL
            para lançamento manual (`source=manual`) e para lançamento
            automatizado gerado por recorrência/parcelamento/conta fixa
            (geração automática já é o próprio evento, não uma "confirmação
            humana" no sentido de RNF-01/08). Não-nulo sempre que
            `import_staging_id` também está preenchido.
        created_via_shortcut:
          type: boolean
          default: false
          description: >-
            **Novo — BE-REF-02 (RNF-12, ADR-015 Decisão 2).** true quando o
            lançamento foi criado a partir de um clique em `ShortcutChip`
            (RF-REF-03 AC6); false para lançamento via formulário completo
            (default) e para todo lançamento pré-existente. Ortogonal a
            `source` (DIR-35) — nunca inferir um campo a partir do outro:
            `source` é o canal de captura (manual/áudio/foto/importação/
            OpenFinance), `created_via_shortcut` é o ponto de entrada dentro
            da captura manual. Client envia `true` explicitamente só nesse
            fluxo; omitido, persiste `false`.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [kind, amount_cents, transaction_date]
      description: >-
        account_id sai de `required` a partir de BE-REF-04 (era
        `[account_id, kind, amount_cents, transaction_date]`) — ver descrição
        do campo `account_id` acima para a condição exata (obrigatório só
        quando kind=transfer; nos demais casos, obrigatório enviar
        payment_method_id em vez disso, resolvido server-side).

    ImportBatch:
      type: object
      description: >-
        RF-F3-03/RF-F3-04 (BE-F3-00, SDD.md Seção 5.2). Lote de importação
        OFX/CSV (RF-F3-03) ou de sincronização Open Finance (RF-F3-04),
        agrupa N `CandidateTransaction`. `source` restrito a
        `import`/`openfinance` — voz/foto nunca formam lote (candidato avulso,
        `import_batch_id` null, ver `CandidateTransaction`).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        source: { type: string, enum: [import, openfinance] }
        status:
          type: string
          enum: [processing, ready_for_review, completed, failed]
          default: processing
          description: >-
            processing (arquivo/sync ainda sendo parseado) -> ready_for_review
            (candidatos gerados, aguardando revisão do usuário, RF-F3-03 AC1)
            -> completed (todo candidato do lote saiu de pending) | failed
            (erro de parsing/sync).
        raw_metadata:
          type: object
          default: {}
          description: "Metadado leve não normalizado (nome do arquivo, referência de conexão Open Finance) — schema livre, decisão física do Backend."
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
      required: [source]

    CandidateTransaction:
      type: object
      description: >-
        RF-F3-01/02/03/04, RNF-01, RNF-08 (BE-F3-00, SDD.md Seção 5.2).
        Candidato de lançamento extraído automaticamente (voz, foto/OCR,
        importação OFX/CSV, Open Finance) — nunca é uma Transaction até passar
        por confirmação humana explícita (DIR-20). `status`/`confirmed_at`/
        `discarded_at`/`resulting_transaction_id` só são alterados pelas RPCs
        `confirm_candidate_transaction`/`discard_candidate_transaction` —
        PATCH direto em `/candidate_transaction` é sempre negado (sem policy
        de UPDATE para `authenticated`, RLS nega por padrão).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid, readOnly: true }
        import_batch_id:
          type: string
          format: uuid
          nullable: true
          description: "NULL para candidato de voz/foto (avulso, sem lote); preenchido para importação/Open Finance."
        source: { type: string, enum: [audio, ocr, import, openfinance], description: "nunca 'manual' (CHECK candidate_transaction_source_not_manual)" }
        status:
          type: string
          enum: [pending, confirmed, discarded]
          default: pending
          readOnly: true
          description: "Só transiciona via as 2 RPCs abaixo — nunca aceito em POST/PATCH direto (POST só aceita o default 'pending')."
        raw_payload:
          type: object
          default: {}
          description: "Dado bruto da extração (transcrição/campos de OCR/linha OFX/registro Open Finance) — schema livre por fonte."
        duplicate_of_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: "Possível duplicata de um lançamento já existente (RF-F3-03 AC2) — só sinaliza, nunca bloqueia a confirmação."
        resulting_transaction_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: "Preenchido só por confirm_candidate_transaction — a Transaction real gerada a partir deste candidato (0:1)."
        confirmed_at: { type: string, format: date-time, nullable: true, readOnly: true }
        discarded_at: { type: string, format: date-time, nullable: true, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [source]

paths:
  /accounts:
    get:
      summary: Listar contas do usuário autenticado (RF-MVP-01)
      tags: [Contas]
      parameters:
        - in: query
          name: is_active
          schema: { type: string, example: "eq.true" }
          description: "Filtro PostgREST, ex. ?is_active=eq.true para listar só contas ativas"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
    post:
      summary: Criar conta (RF-MVP-01 AC1) — dispara seed das 4 formas de pagamento padrão se for a 1ª conta ativa (BE-M-02)
      tags: [Contas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Account" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400":
          description: "Campo obrigatório ausente (RF-MVP-01 AC2)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /accounts?id=eq.{id}:
    patch:
      summary: Editar conta — nome/saldo inicial recalcula saldo consolidado (RF-MVP-01 AC3)
      tags: [Contas]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
      responses:
        "200": { description: OK }
    delete:
      summary: Excluir conta (RF-MVP-01 AC4, RN-08)
      tags: [Contas]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "Excluída (sem lançamento vinculado)" }
        "409":
          description: >-
            Conta possui lançamentos vinculados — exclusão bloqueada por trigger
            `accounts_before_delete_block_linked` (RN-08). Front deve oferecer
            inativação (`PATCH .../accounts?id=eq.{id}` com `is_active: false`)
            como alternativa, conforme UX-SPEC. **BE-M-13**: o trigger agora é
            `SECURITY DEFINER` — o bloqueio vale mesmo se o lançamento vinculado
            pertencer a outro usuário (não deveria acontecer, dado o `EXISTS` de
            ownership de FK em `transactions_insert_own`, mas o trigger não
            depende disso para funcionar corretamente).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /payment_methods:
    get:
      summary: Listar formas de pagamento do usuário (RF-MVP-02)
      tags: [Formas de Pagamento]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } } } }
    post:
      summary: Cadastrar forma de pagamento customizada (RF-MVP-02 AC3)
      tags: [Formas de Pagamento]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentMethod" } } }
      responses:
        "201": { description: Criada }

  /payment_methods?id=eq.{id}:
    patch:
      summary: Editar forma de pagamento customizada
      tags: [Formas de Pagamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "403":
          description: "is_system_default = true — formas padrão não são editáveis (RF-MVP-02 AC1)"
    delete:
      summary: Excluir forma de pagamento customizada
      tags: [Formas de Pagamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "403": { description: "is_system_default = true — formas padrão não são excluíveis" }

  /categories:
    get:
      summary: Listar categorias/subcategorias (padrão do sistema + do usuário) (RF-MVP-03)
      tags: [Categorias]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } } }
    post:
      summary: Criar categoria/subcategoria (RF-MVP-03 AC1/AC2)
      tags: [Categorias]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } }
      responses:
        "201": { description: Criada }
        "409":
          description: "Hierarquia inválida (auto-referência, mais de 1 nível, pai de outro usuário) — trigger validate_category_hierarchy"

  /categories?id=eq.{id}:
    patch:
      summary: Editar categoria/subcategoria (RF-MVP-03 AC2)
      tags: [Categorias]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }
    delete:
      summary: Excluir categoria (RF-MVP-03 AC3, RN-09)
      tags: [Categorias]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "Excluída (sem lançamento/orçamento vinculado)" }
        "409":
          description: >-
            Categoria possui lançamentos ou orçamentos vinculados — exclusão
            bloqueada por trigger `categories_before_delete_block_linked` (RN-09).
            Front deve buscar `GET /transactions?category_id=eq.{id}` para exibir a
            lista de lançamentos afetados, conforme RF-MVP-03 AC3. **BE-M-13**: o
            trigger agora é `SECURITY DEFINER` — categoria de sistema ou
            categoria com vínculo de OUTRO usuário (cenário do achado original do
            DevSecOps, `BLOCKERS.md` Bloqueio 010) também bloqueia corretamente,
            não só vínculo do próprio dono da categoria.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /budget:
    get:
      summary: Listar orçamentos por categoria/mês (RF-MVP-07)
      tags: [Orçamento]
      parameters:
        - in: query
          name: month
          schema: { type: string, example: "eq.2026-09-01" }
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Budget" } } } }
    post:
      summary: Definir teto de orçamento para categoria/mês (RF-MVP-07 AC1)
      tags: [Orçamento]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } }
      responses:
        "201": { description: Criado }
        "403":
          description: >-
            **Novo — BE-M-13.** `category_id` não pertence ao usuário autenticado
            (nem é categoria de sistema, `user_id IS NULL`) — rejeitado pela
            policy `budget_insert_own` (`EXISTS` de ownership de FK, Bloqueio
            010/SEC-DEBT-002). PostgREST mapeia violação de RLS `WITH CHECK`
            (`42501`) para 403.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { description: "Já existe orçamento para essa categoria/mês (unique constraint) — usar PATCH em vez de POST" }

  /budget?id=eq.{id}:
    patch:
      summary: Editar teto/limiar de alerta de um orçamento
      tags: [Orçamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "403":
          description: >-
            **Novo — BE-M-13.** Tentativa de redirecionar `category_id` para uma
            categoria de outro usuário — rejeitado pela policy `budget_update_own`
            (mesma correção de ownership de FK do POST).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Remover orçamento
      tags: [Orçamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /credit_cards:
    get:
      summary: Listar cartões de crédito do usuário (RF-F2-01)
      tags: [Cartão & Fatura]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CreditCard" } } } }
    post:
      summary: Cadastrar cartão de crédito (RF-F2-01 AC1) — dispara a criação automática da forma de pagamento "crédito" vinculada
      tags: [Cartão & Fatura]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } }
      responses:
        "201":
          description: Criado — buscar `GET /payment_methods?credit_card_id=eq.{id}` para obter a forma de pagamento derivada
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditCard" } } }
        "400": { description: "limit_cents <= 0, ou closing_day/due_day fora do intervalo 1-31 (CHECK constraint)" }

  /credit_cards?id=eq.{id}:
    patch:
      summary: Editar cartão (limite, dia de fechamento/vencimento, nome)
      tags: [Cartão & Fatura]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }
    delete:
      summary: Excluir cartão
      tags: [Cartão & Fatura]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "Excluído — a forma de pagamento derivada é removida em cascata (payment_methods_credit_card_id_fkey ON DELETE CASCADE)" }
        "409":
          description: >-
            Existe lançamento usando a forma de pagamento derivada deste cartão —
            o CASCADE em payment_methods esbarra na FK RESTRICT de
            transactions.payment_method_id, abortando o DELETE (nenhuma RN nova
            necessária, mesma proteção implícita já em vigor para payment_methods).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /invoices:
    get:
      summary: Listar faturas do usuário (RF-F2-05) — competência atual + 2 futuras por cartão, mais o que já existir de anteriores
      tags: [Cartão & Fatura]
      parameters:
        - in: query
          name: credit_card_id
          schema: { type: string, example: "eq.<uuid>" }
        - in: query
          name: order
          schema: { type: string, example: "competencia.asc" }
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invoice" } } } }

  /rpc/get_credit_cards_available_limit:
    post:
      summary: Limite disponível por cartão do usuário (RN-06) — soma toda despesa já lançada em fatura aberta ou fechada, não só a corrente
      tags: [Cartão & Fatura]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    credit_card_id: { type: string, format: uuid }
                    name: { type: string }
                    limit_cents: { type: integer, format: int64 }
                    committed_cents: { type: integer, format: int64, description: "soma de amount_cents de despesas em faturas aberta+fechada" }
                    available_cents: { type: integer, format: int64, description: "limit_cents - committed_cents" }

  /recurring_templates:
    get:
      summary: Listar templates de recorrência do usuário (RF-F2-02)
      tags: [Recorrência & Parcelamento]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RecurringTemplate" } } } }
    post:
      summary: Cadastrar gasto recorrente (RF-F2-02 AC1) — passa a gerar 1 lançamento por competência automaticamente, a partir de start_date
      tags: [Recorrência & Parcelamento]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/RecurringTemplate" } } }
      responses:
        "201": { description: Criado }
        "403":
          description: "category_id/account_id/payment_method_id não pertence ao usuário autenticado (nem categoria de sistema) — rejeitado pela policy (EXISTS de ownership de FK, mesmo padrão de BE-M-13/BE-F2-01)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recurring_templates?id=eq.{id}:
    patch:
      summary: Editar template (valor, dia do mês, categoria/conta/forma) ou encerrar (end_date) — RF-F2-02 AC2
      tags: [Recorrência & Parcelamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }
    delete:
      summary: Excluir template — lançamentos já gerados são preservados (RN-07, recurring_rule_id vira NULL)
      tags: [Recorrência & Parcelamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /recurring_template_adjustments:
    get:
      summary: Listar histórico de reajuste de um template (RF-F2-03)
      tags: [Recorrência & Parcelamento]
      parameters:
        - in: query
          name: recurring_template_id
          schema: { type: string, example: "eq.<uuid>" }
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RecurringTemplateAdjustment" } } } }
    post:
      summary: Cadastrar reajuste (RF-F2-03 AC1/AC2) — Front deve confirmar explicitamente com o usuário "a partir de qual competência" ANTES de enviar (AC1); cancelar a confirmação = simplesmente não enviar (AC3)
      tags: [Recorrência & Parcelamento]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/RecurringTemplateAdjustment" } } }
      responses:
        "201": { description: Criado }
        "400":
          description: "effective_from anterior ao mês corrente (reajuste retroativo, RN-02) — trigger rejeita, não é CHECK constraint (depende de current_date)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "recurring_template_id não pertence ao usuário autenticado — rejeitado pela policy (EXISTS de ownership de FK)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { description: "Já existe reajuste para esse (template, competência) — usar PATCH em vez de POST" }

  /recurring_template_adjustments?id=eq.{id}:
    patch:
      summary: Editar um reajuste já cadastrado (ex. corrigir valor ou competência antes de valer)
      tags: [Recorrência & Parcelamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }
    delete:
      summary: Remover um reajuste (nunca apaga lançamento já gerado — reajuste é só metadado de vigência futura)
      tags: [Recorrência & Parcelamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /installment_purchases:
    get:
      summary: Listar compras parceladas do usuário (RF-F2-04)
      tags: [Recorrência & Parcelamento]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/InstallmentPurchase" } } } }
    post:
      summary: Cadastrar compra parcelada (RF-F2-04 AC1) — passa a gerar 1 parcela por fatura até completar installments_count
      tags: [Recorrência & Parcelamento]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/InstallmentPurchase" } } }
      responses:
        "201": { description: Criado }
        "400": { description: "payment_method_id não é type=credit_card (RF-F2-04) — trigger rejeita" }
        "403":
          description: "category_id/account_id/payment_method_id não pertence ao usuário autenticado (nem categoria de sistema) — rejeitado pela policy (EXISTS de ownership de FK)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /installment_purchases?id=eq.{id}:
    patch:
      summary: Editar descrição/categoria/conta do plano — total/nº de parcelas/data da compra/forma de pagamento ficam imutáveis assim que a 1ª parcela já foi gerada
      tags: [Recorrência & Parcelamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "400": { description: "Tentativa de mudar total_amount_cents/installments_count/purchase_date/payment_method_id depois que a 1ª parcela já foi gerada" }
    delete:
      summary: Excluir o plano — parcelas já geradas são preservadas (RN-07, installment_plan_id vira NULL)
      tags: [Recorrência & Parcelamento]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /rpc/get_installment_purchases_progress:
    post:
      summary: "\"Parcela X de N\" por compra parcelada do usuário (RF-F2-04 AC2)"
      tags: [Recorrência & Parcelamento]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    installment_purchase_id: { type: string, format: uuid }
                    description: { type: string }
                    installments_count: { type: integer }
                    generated_count: { type: integer, description: "quantas parcelas já foram lançadas" }
                    remaining_count: { type: integer, description: "installments_count - generated_count" }

  /fixed_bills:
    get:
      summary: Listar contas fixas do usuário (RF-F2-06)
      tags: [Contas Fixas]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FixedBill" } } } }
    post:
      summary: Cadastrar conta fixa (RF-F2-06 AC1) — passa a gerar 1 lançamento previsto (pending) por competência, assim que o mês começa
      tags: [Contas Fixas]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/FixedBill" } } }
      responses:
        "201": { description: Criado }
        "403":
          description: "category_id/account_id/payment_method_id não pertence ao usuário autenticado (nem categoria de sistema) — rejeitado pela policy (EXISTS de ownership de FK)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /fixed_bills?id=eq.{id}:
    patch:
      summary: Editar conta fixa (valor, dia de vencimento, categoria/conta/forma) ou encerrar (end_date)
      tags: [Contas Fixas]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }
    delete:
      summary: Excluir conta fixa — lançamentos já gerados são preservados (RN-07, fixed_bill_id vira NULL)
      tags: [Contas Fixas]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /rpc/get_fixed_bills_status:
    post:
      summary: Status da competência corrente por conta fixa, incluindo "vencida" (RF-F2-06/RF-F2-07 AC2)
      tags: [Contas Fixas]
      description: >-
        **BE-F2-07.** `is_overdue` deriva de `status=pending` + `transaction_date`
        no passado — sem estado novo no modelo. Achado de desenho: o job legado
        `fn_clear_due_transactions` (a cada 15min) foi ajustado para NÃO
        promover lançamento de conta fixa pending->cleared automaticamente
        (só continua fazendo isso para lançamento comum), preservando a
        distinção entre "vencida" (ainda pending, passou do vencimento) e
        "paga" (cleared, ação explícita do usuário via PATCH /transactions).
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    fixed_bill_id: { type: string, format: uuid }
                    description: { type: string }
                    amount_cents: { type: integer, format: int64 }
                    due_day: { type: integer }
                    current_transaction_id: { type: string, format: uuid, nullable: true }
                    current_due_date: { type: string, format: date, nullable: true }
                    current_status: { type: string, enum: [pending, cleared, reconciled], nullable: true }
                    is_overdue: { type: boolean }

  /push_subscriptions:
    get:
      summary: Listar inscrições de push do usuário (para UI de "dispositivos conectados", se necessário)
      tags: [Notificações & Configurações]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PushSubscription" } } } }
    post:
      summary: Registrar inscrição de push (resultado de PushManager.subscribe() no client)
      tags: [Notificações & Configurações]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscription" } } }
      responses:
        "201": { description: Criada }

  /push_subscriptions?id=eq.{id}:
    delete:
      summary: Remover inscrição de push (ex. usuário desativou notificações neste dispositivo)
      tags: [Notificações & Configurações]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /notifications:
    get:
      summary: Listar histórico de notificações do usuário, mais recentes primeiro (RF-F2-09 AC2)
      tags: [Notificações & Configurações]
      parameters:
        - in: query
          name: order
          schema: { type: string, example: "created_at.desc" }
        - in: query
          name: read_at
          schema: { type: string, example: "is.null" }
          description: "Filtrar só não lidas: ?read_at=is.null"
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notification" } } } }

  /notifications?id=eq.{id}:
    patch:
      summary: Marcar notificação como lida
      tags: [Notificações & Configurações]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { read_at: { type: string, format: date-time } } } } }
      responses: { "200": { description: OK } }

  /goals:
    get:
      summary: Listar metas do usuário (RF-F2-08)
      tags: [Metas]
      parameters:
        - in: query
          name: is_active
          schema: { type: string, example: "eq.true" }
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Goal" } } } }
    post:
      summary: Cadastrar meta (RF-F2-08 AC1)
      tags: [Metas]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } }
      responses:
        "201": { description: Criado }
        "400": { description: "target_amount_cents <= 0 (CHECK constraint)" }

  /goals?id=eq.{id}:
    patch:
      summary: Editar meta (nome, valor-alvo, prazo) ou arquivar (is_active=false)
      tags: [Metas]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }
    delete:
      summary: Excluir meta — aportes vinculados são removidos em cascata (contributions.goal_id ON DELETE CASCADE, não é um Transaction do ledger)
      tags: [Metas]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /rpc/get_goals_progress:
    post:
      summary: Progresso (valor atual + percentual) de cada meta do usuário (RF-F2-08 AC1-2)
      tags: [Metas]
      description: >-
        **BE-F2-08.** `current_amount_cents`/`pct_progress` são sempre
        calculados ao vivo somando `contributions.amount_cents` — nunca uma
        coluna cacheada em Goal — "recalculado a cada aporte vinculado" por
        construção (critério de aceite literal). `pct_progress` pode passar
        de 100 quando a meta é superada, sem clamp.
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    goal_id: { type: string, format: uuid }
                    name: { type: string }
                    target_amount_cents: { type: integer, format: int64 }
                    target_date: { type: string, format: date, nullable: true }
                    is_active: { type: boolean }
                    current_amount_cents: { type: integer, format: int64 }
                    pct_progress: { type: number, description: "arredondado a 2 casas decimais; sem teto em 100" }

  /contributions:
    get:
      summary: Listar aportes do usuário, mais recentes primeiro (S-GOAL-03/04)
      tags: [Metas]
      parameters:
        - in: query
          name: goal_id
          schema: { type: string, example: "eq.<uuid>" }
        - in: query
          name: order
          schema: { type: string, example: "contribution_date.desc" }
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Contribution" } } } }
    post:
      summary: Registrar aporte vinculado a uma meta (RF-F2-08 AC1) — dispara o recálculo de progresso (ao vivo, ver /rpc/get_goals_progress)
      tags: [Metas]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Contribution" } } }
      responses:
        "201": { description: Criado }
        "400": { description: "amount_cents <= 0 (CHECK constraint)" }
        "403":
          description: "goal_id não pertence ao usuário autenticado — rejeitado pela policy contributions_insert_own (EXISTS de ownership de FK, G-19)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /contributions?id=eq.{id}:
    delete:
      summary: Remover aporte — progresso é recalculado imediatamente (ao vivo)
      tags: [Metas]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /rpc/get_income_expense_report:
    post:
      summary: Relatório comparativo entradas x saídas, últimos 6 meses com dado disponível (RF-F2-10 AC1-2)
      tags: [Relatórios]
      description: >-
        **BE-F2-10.** Janela fixa (mês corrente + 5 anteriores,
        America/Sao_Paulo). Só retorna mês com ao menos 1 lançamento
        `kind != transfer` — nunca uma linha "zero fabricado" para mês sem
        dado (AC2); com menos de 6 meses de histórico, a resposta traz só os
        meses efetivamente disponíveis (nº de linhas < 6).
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    month: { type: string, format: date, description: "sempre o 1º dia do mês" }
                    income_cents: { type: integer, format: int64 }
                    expense_cents: { type: integer, format: int64 }

  /rpc/get_net_worth_evolution:
    post:
      summary: Série temporal do saldo consolidado, filtrável por conta (RF-F3-05 AC1-2)
      tags: [Relatórios]
      description: >-
        **BE-F3-06.** Mesma janela/granularidade de `/rpc/get_income_expense_report`
        (BE-F2-10, mesma família "Relatórios & Exportação"): mês corrente + 5
        anteriores, America/Sao_Paulo — decisão de interpretação pequena, já
        que RF-F3-05 AC1-2 não fixa janela/granularidade. Cada ponto é o
        saldo consolidado (soma de `accounts.current_balance_cents` das
        contas ativas do usuário, mesma fonte de `get_month_provision`,
        BE-M-07) reconstruído ao final daquele mês, revertendo o efeito de
        toda transação datada depois do fim do mês. `p_account_id` (AC2)
        restringe a soma a uma única conta; conta alheia ou inativa produz
        lista vazia, nunca erro. Somar a série de cada conta individual do
        usuário reproduz exatamente a série consolidada, por construção —
        critério de aceite literal desta tarefa, provado em
        `supabase/tests/be_f3_06_net_worth_evolution.test.sql`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p_account_id: { type: string, format: uuid, nullable: true, description: "Omitido/null = visão consolidada (todas as contas ativas)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    month: { type: string, format: date, description: "sempre o 1º dia do mês" }
                    balance_cents: { type: integer, format: int64, description: "saldo consolidado (ou da conta filtrada) ao final do mês" }

  /rpc/get_report_export_rows:
    post:
      summary: Lançamentos do período com conta/forma de pagamento/categoria/subcategoria resolvidos (RF-F3-06 AC1 — BE-F3-07)
      tags: [Relatórios]
      description: >-
        **BE-F3-07.** Usada internamente pela Edge Function `/report-export`
        (não pensada para consumo direto do Frontend, mas exposta como
        qualquer outra RPC `SECURITY INVOKER` escopada por `auth.uid()`,
        mesma família de `/rpc/get_income_expense_report`/
        `/rpc/get_net_worth_evolution`). Devolve 1 linha por lançamento do
        usuário autenticado no período `[p_start_date, p_end_date]`, com
        `category_name` sempre a categoria de TOPO e `subcategory_name`
        preenchida só quando o lançamento usa uma subcategoria de 2º nível
        (nunca os dois níveis invertidos). Inclui `kind=transfer`
        (diferente de `get_income_expense_report`, que o exclui) — é um
        extrato/ledger completo do período, não um comparativo; a exclusão
        de `transfer` de entradas/saídas acontece só no resumo do PDF
        (`supabase/functions/report-export/lib.ts:computeReportSummary`).
        Período sem nenhum lançamento retorna lista vazia, nunca erro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_start_date, p_end_date]
              properties:
                p_start_date: { type: string, format: date }
                p_end_date: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    transaction_date: { type: string, format: date }
                    account_name: { type: string }
                    payment_method_name: { type: string, nullable: true, description: "null para kind=transfer" }
                    category_name: { type: string, nullable: true, description: "categoria de TOPO; null para kind=transfer" }
                    subcategory_name: { type: string, nullable: true, description: "só preenchida quando o lançamento usa subcategoria de 2º nível" }
                    description: { type: string, nullable: true }
                    kind: { type: string, enum: [income, expense, transfer] }
                    amount_cents: { type: integer, format: int64 }

  /report-export:
    post:
      summary: "Exportação CSV/PDF de lançamentos por período (RF-F3-06 AC1-2 — BE-F3-07)"
      tags: [Relatórios]
      servers:
        - url: https://xrcxbzrglndetrrhavhc.supabase.co/functions/v1
          description: Edge Functions
      description: >-
        **Nova — BE-F3-07**, `supabase/functions/report-export/`. Gera a
        exportação do período informado a partir de `/rpc/get_report_export_rows`
        (via cliente com o JWT do próprio usuário — RLS aplicada, nunca
        `service_role`), monta o CSV (AC1 — data, conta, forma de
        pagamento, categoria, subcategoria, descrição, tipo, valor, `;` como
        delimitador, BOM UTF-8) ou o PDF (AC2 — resumo do período: saldo,
        entradas, saídas, distribuição por categoria, via `npm:pdf-lib`,
        `supabase/functions/report-export/pdf.ts`), faz upload ao bucket
        privado `exports` (pasta `<user_id>/...`, isolamento por policy —
        migration `20260909110000_be_f3_07_report_export.sql`) e devolve uma
        signed URL de curta duração (300s, SDD.md Seção 7/ADR-011, mesmo
        princípio de G-18) para o download (UX-SPEC.md S-REP-03:
        "botão Exportar → indicador de geração → download"). Nenhuma tabela
        de metadado nova rastreia a idade do export — o `created_at` do
        próprio objeto no Storage já é suficiente para a futura `BE-F3-08`
        (job de expurgo de export com mais de 24h, ainda Não iniciada)
        filtrar por idade.

        `kind=transfer` é incluído no CSV (extrato completo do período) mas
        excluído de entradas/saídas do resumo do PDF (mesmo critério de
        `/rpc/get_income_expense_report`, BE-F2-10 — movimentação interna
        não é entrada nem saída). Sem filtro de conta (UX-SPEC.md S-REP-03
        só define período + formato, decisão de escopo documentada em
        `lib.ts`). Exige `Authorization: Bearer <JWT de sessão>` — mesmo
        padrão de `/receipt-ocr`/`/voice-capture`/`/statement-import`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, format]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                format: { type: string, enum: [csv, pdf] }
      responses:
        "200":
          description: "Arquivo gerado e persistido no bucket privado; signed_url pronta para download imediato."
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_url: { type: string, format: uri }
                  filename: { type: string }
                  expires_in: { type: integer, description: "segundos até a signed URL expirar (300)" }
                  total_rows: { type: integer }
        "400": { description: "missing_start_date/missing_end_date/invalid_start_date/invalid_end_date (formato aaaa-mm-dd ou data de calendário implausível), invalid_date_range (start_date > end_date), invalid_format (fora de csv/pdf)." }
        "401": { description: "JWT ausente/inválido/expirado." }
        "500": { description: "export_generation_failed — falha inesperada ao montar o CSV/PDF em si (nunca esperada para entrada válida)." }
        "502": { description: "report_data_unavailable (falha ao consultar /rpc/get_report_export_rows) ou export_storage_failed (falha ao persistir no bucket ou criar a signed URL) — nenhum download parcial/quebrado é oferecido." }
        "503": { description: "auth_unavailable — Auth indisponível ao validar a sessão." }

  /transactions:
    get:
      summary: Listar lançamentos, mês corrente por padrão (RF-MVP-04 AC5)
      tags: [Lançamentos]
      parameters:
        - in: query
          name: transaction_date
          schema: { type: string, example: "gte.2026-09-01" }
          description: "Front filtra por período/conta/forma/categoria via query params PostgREST (ex. ?account_id=eq.<uuid>)"
        - in: query
          name: order
          schema: { type: string, example: "transaction_date.desc" }
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } } } }
    post:
      summary: Criar lançamento manual (RF-MVP-04 AC1) — atualiza o saldo da conta imediatamente
      tags: [Lançamentos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transaction" }
      responses:
        "201":
          description: "Criado — accounts.current_balance_cents já reflete o efeito (trigger transactions_maintain_account_balance / apply_transaction_effect, testado em BE-M-00)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } }
        "400":
          description: >-
            Campo obrigatório ausente — nada é persistido parcialmente
            (RF-MVP-04 AC2). **Novo — BE-REF-04.** Também retornado quando
            account_id é omitido e payment_method_id referenciado não
            pertence ao usuário autenticado (checagem própria do trigger
            transactions_default_account_from_payment_method, independente de
            RLS — ADR-016 Decisão 3/5), e quando account_id é omitido com
            kind=transfer ou payment_method_id ausente (o trigger não atua
            nesses casos, account_id continua NOT NULL na tabela).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: >-
            **Novo — BE-M-13.** `account_id`, `category_id`, `payment_method_id`
            ou `destination_account_id` referencia uma entidade que não pertence
            ao usuário autenticado (categoria de sistema, `user_id IS NULL`,
            continua permitida) — rejeitado pela policy `transactions_insert_own`
            (`EXISTS` de ownership de FK por coluna, Bloqueio 010/SEC-DEBT-002).
            PostgREST mapeia violação de RLS `WITH CHECK` (`42501`) para 403.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: >-
            Conta inativa (transactions_block_inactive_account) ou violação de
            CHECK (ex. kind=transfer sem destination_account_id válido, amount_cents <= 0)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /transactions?id=eq.{id}:
    patch:
      summary: Editar lançamento (RF-MVP-04 AC3) — recalcula saldo (reverte efeito antigo, aplica o novo)
      tags: [Lançamentos]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } }
      responses:
        "200": { description: OK }
        "403":
          description: >-
            **Novo — BE-M-13.** Tentativa de redirecionar qualquer uma das 4 FKs
            (`account_id`/`category_id`/`payment_method_id`/`destination_account_id`)
            para uma entidade de outro usuário — rejeitado pela policy
            `transactions_update_own` (mesma correção de ownership de FK do POST).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Excluir lançamento (RF-MVP-04 AC4) — reverte efeito no saldo da conta
      tags: [Lançamentos]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }

  /rpc/get_month_provision:
    post:
      summary: "Saldo consolidado do mês (RF-MVP-05 AC1, RF-MVP-06 AC1)"
      tags: [Dashboard]
      description: >-
        RPC pré-existente (implementação anterior, ADR-012), auditada em
        `AUDITORIA-BE-M-00.md` Seção 5. **Achado de contrato confirmado
        empiricamente**: `current_total_balance_cents` já reflete o efeito de
        lançamentos futuros ("pending") no momento em que são criados (o trigger
        de saldo não olha `status`) — é este o campo correto para RF-MVP-05 AC1
        ("saldo total consolidado"). `provisioned_balance_cents` **soma
        `pending_income`/subtrai `pending_expense` do mês por cima de
        `current_total_balance_cents`, que já os inclui — resultado
        double-counted, não confiável hoje**. Nenhuma tarefa MVP exige esse campo
        (RF-MVP-05/06 não pedem "saldo projetado"); Frontend não deve consumir
        `provisioned_balance_cents` até uma correção formal (fora do escopo do
        MVP — mudar a função exige revisão do CTO, DIR-03/BE-M-07).
      requestBody:
        content: { application/json: { schema: { type: object, properties: {} } } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_total_balance_cents: { type: integer, format: int64, description: "Usar este campo para RF-MVP-05 AC1 — soma de accounts.current_balance_cents de contas ativas." }
                  pending_income_cents: { type: integer, format: int64 }
                  pending_expense_cents: { type: integer, format: int64 }
                  provisioned_balance_cents: { type: integer, format: int64, deprecated: true, description: "NÃO USAR no MVP — double-counting confirmado, ver descrição do endpoint." }

  /rpc/get_monthly_category_summary:
    post:
      summary: "Distribuição de entradas/saídas por categoria no mês (RF-MVP-06 AC1/AC2)"
      tags: [Dashboard]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p_month: { type: string, format: date, nullable: true, description: "default: mês corrente" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category_id: { type: string, format: uuid }
                    category_name: { type: string }
                    kind: { type: string, enum: [income, expense] }
                    total_cents: { type: integer, format: int64 }

  /rpc/get_month_transaction_count:
    post:
      summary: "Quantidade de lançamentos do mês (RF-MVP-06 AC3)"
      tags: [Dashboard]
      description: >-
        **Nova — BE-M-07**, migration `20260902100200_be_m07_month_transaction_count.sql`.
        Nenhuma RPC pré-existente cobria esta contagem (achado de auditoria).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p_month: { type: string, format: date, nullable: true, description: "default: mês corrente" }
      responses:
        "200":
          content: { application/json: { schema: { type: integer } } }

