      vinculada (payment_methods.credit_card_id, coluna antecipada desde a Fase 1,
      FK adicionada nesta migration). Extensão transparente de escopo: como
      credit_card_id passou a apontar para uma tabela "ownable" nova,
      payment_methods_insert_own/_update_own também passam a validar ownership de
      credit_card_id (mesmo padrão EXISTS de BE-M-13/Bloqueio 010), para não reabrir
      a mesma classe de IDOR corrigida naquela tarefa. Nota de descrição atualizada
      em PaymentMethod.is_system_default (não é mais "não semeado no MVP" — agora
      existe, sempre false). Fechamento de fatura e limite disponível (RN-06) ficam
      para BE-F2-02, ainda não publicados.
  - version: "0.9.0"
    date: "2026-09-03"
    change: >-
      Adiciona /invoices e /rpc/get_credit_cards_available_limit (BE-F2-02,
      RF-F2-05 AC2/AC3, RN-01, RN-06). `Transaction.card_invoice_id` passa a ser
      resolvido automaticamente pelo servidor (readOnly) quando o meio de
      pagamento é um cartão de crédito — "lançamento pós-fechamento entra na
      próxima fatura, nunca na já fechada" é garantido de forma síncrona no
      próprio INSERT/UPDATE de /transactions, não depende de nenhum job
      assíncrono. `Invoice.status` também é readOnly — só muda via job
      periódico (Edge Function invoice-close, diária), PATCH/DELETE em
      /invoices não têm efeito (RLS sem policy de escrita para authenticated
      além do INSERT interno). Sem breaking change nos endpoints já publicados.
  - version: "0.10.0"
    date: "2026-09-03"
    change: >-
      Adiciona /recurring_templates (BE-F2-03, RF-F2-02 AC1/AC2, RN-07).
      Job diário (Edge Function recurring-generate) gera 1 Transaction por
      competência para todo template ativo, idempotente — `Transaction.
      recurring_rule_id` passa a ser resolvido pelo servidor (readOnly) só
      nos lançamentos gerados assim, nunca aceito do client em POST manual.
      Encerrar recorrência é PATCH `end_date` (AC2); excluir o template
      (DELETE) preserva os lançamentos já gerados, só desfaz o vínculo
      (RN-07, recurring_rule_id vira NULL — FK ON DELETE SET NULL, nunca
      CASCADE). "Reajuste com histórico" (RF-F2-03) ainda não publicado —
      fica para BE-F2-04. Sem breaking change nos endpoints já publicados.
  - version: "0.11.0"
    date: "2026-09-03"
    change: >-
      Adiciona /recurring_template_adjustments (BE-F2-04, RF-F2-03 AC1-3,
      RN-02). `RecurringTemplate.amount_cents` passa a ser **imutável após a
      criação** (PATCH tentando mudá-lo agora retorna 400) — todo reajuste
      passa exclusivamente por POST /recurring_template_adjustments, sempre
      prospectivo (effective_from < mês corrente também retorna 400). O job
      diário de geração (recurring-generate, BE-F2-03) passa a resolver o
      valor vigente a cada competência pelo histórico de reajuste, não mais
      lendo amount_cents bruto — comportamento novo, mas nenhum endpoint
      antigo muda de contrato. Breaking change pontual: clientes que
      dependiam de PATCH /recurring_templates com amount_cents pra reajustar
      (nenhum ainda, FE-F2-04 não implementado) precisam migrar para o novo
      endpoint.
  - version: "0.12.0"
    date: "2026-09-03"
    change: >-
      Adiciona /installment_purchases e /rpc/get_installment_purchases_progress
      (BE-F2-05, RF-F2-04 AC1/AC2, RN-07). `Transaction.installment_plan_id`/
      `installment_number` passam a ser resolvidos pelo servidor (readOnly),
      preenchidos só nas parcelas geradas automaticamente. Reaproveita o
      mesmo job diário de RecurringTemplate (recurring-generate, BE-F2-03) —
      Recorrência e Parcelamento são o mesmo bounded context/Lote neste
      projeto; nenhum secret/cron novo. `total_amount_cents`/
      `installments_count`/`purchase_date`/`payment_method_id` ficam
      imutáveis assim que a 1ª parcela já foi gerada (mesmo racional de
      RecurringTemplate.amount_cents em BE-F2-04, agora estendido a 4 campos
      por integridade de sequência). Sem breaking change nos endpoints já
      publicados.
  - version: "0.13.0"
    date: "2026-09-03"
    change: >-
      Adiciona /fixed_bills (BE-F2-06, RF-F2-06 AC1). `Transaction.
      fixed_bill_id` passa a ser resolvido pelo servidor (readOnly), gerado
      diariamente (Edge Function fixed-bill-generate, cron próprio — Contas
      Fixas é um Lote/bounded context separado de Recorrência & Parcelamento
      neste projeto, não reaproveita recurring-generate) assim que a
      competência começa, com status inicial "pending" (previsto). Achado de
      desenho documentado: AC2 ("marcar como paga") não precisa de endpoint
      novo — já é PATCH /transactions?id=eq.{id} com status=cleared na
      própria Transaction gerada, contrato já existente desde o MVP. Sem
      breaking change nos endpoints já publicados.
  - version: "0.14.0"
    date: "2026-09-03"
    change: >-
      Adiciona /push_subscriptions e /notifications (BE-F2-09, RF-F2-09
      AC1/AC2, RF-MVP-07/RN-04). Feita fora de ordem em relação ao TASK.md
      (antes de BE-F2-07, ainda não publicado) porque RF-F2-07 depende
      explicitamente de RF-F2-09 na tabela de dependências do
      PRD-TECNICO.md — publicar aviso de conta fixa sem esta infraestrutura
      reimplementaria disparo por conta própria, violando o próprio AC1
      desta tarefa ("sem duplicar lógica de disparo"). `notify_user()` é o
      único ponto de disparo (persiste em /notifications + aciona Web Push
      via Edge Function push-dispatch); client nunca insere notificação
      diretamente (403/404 em POST /notifications). Nenhum endpoint antigo
      muda de contrato.
  - version: "0.15.0"
    date: "2026-09-03"
    change: >-
      Adiciona FixedBill.alert_days_before (RN-05, BE-F2-07) e
      /rpc/get_fixed_bills_status ("vencida", RF-F2-06/RF-F2-07 AC2).
      Achado de desenho: fn_clear_due_transactions (job legado a cada 15min)
      deixou de promover lançamento de conta fixa pending->cleared
      automaticamente — só continua fazendo isso para lançamento comum —
      preservando "vencida" (pending após o vencimento) como distinto de
      "paga" (cleared por ação explícita, PATCH /transactions já existente).
      Sem endpoint novo de disparo — check_fixed_bill_due_alerts (RN-05/AC1)
      reaproveita 100% a infraestrutura de /notifications publicada em
      0.14.0 (BE-F2-09). Sem breaking change nos endpoints já publicados.
  - version: "0.16.0"
    date: "2026-09-03"
    change: >-
      Adiciona /goals, /contributions e /rpc/get_goals_progress (BE-F2-08,
      RF-F2-08 AC1-2). Achado de desenho: Contribution NÃO é um Transaction
      — SDD.md Seção 5.2 não lista coluna antecipatória em `transactions`
      para essa entidade (diferente de RecurringTemplate/InstallmentPurchase/
      Invoice/FixedBill), e UX-FL-15/S-GOAL-03 trata "registrar aporte" como
      ação própria da tela de metas — aporte não afeta saldo de conta nem
      aparece no ledger. Progresso (`current_amount_cents`/`pct_progress`)
      nunca é uma coluna cacheada em Goal — get_goals_progress soma
      contributions ao vivo a cada chamada, satisfazendo por construção o
      critério de aceite literal ("progresso é recalculado a cada aporte
      vinculado"), sem clamp em 100% quando a meta é superada. `contributions
      .goal_id` valida ownership via EXISTS na policy de INSERT/UPDATE desde
      a criação (G-19/GUARDRAILS.md). Sem breaking change nos endpoints já
      publicados.
  - version: "0.17.0"
    date: "2026-09-03"
    change: >-
      Adiciona /rpc/get_income_expense_report (BE-F2-10, RF-F2-10 AC1-2).
      Janela fixa de 6 meses (mês corrente + 5 anteriores, America/Sao_Paulo);
      só retorna mês com ao menos 1 lançamento kind != transfer — nenhuma
      linha "zero fabricado" é gerada para mês sem dado (AC2), por construção
      do GROUP BY (prova estrutural, coberta em supabase/tests/be_f2_10_
      income_expense_report.test.sql). Sem tabela nova, sem Edge Function
      (DIR-33 não se aplica). Sem breaking change nos endpoints já
      publicados.
  - version: "0.18.0"
    date: "2026-09-04"
    change: >-
      Adiciona /rpc/get_transaction_shortcuts (BE-REF-02, RF-REF-03 AC1, AC2,
      AC7, AC8; RN-12; RN-13; ADR-015) e o campo Transaction.created_via_shortcut
      (RNF-12, ADR-015 Decisão 2). RPC única fonte de verdade do algoritmo de
      ranking/desempate (DIR-34) — janela de 90 dias + fallback ao histórico
      completo quando há menos de 10 subcategorias distintas na janela,
      desempate por recência e ordem alfabética; payment_method_id resolvido
      pelo mesmo critério de janela+fallback por subcategoria, null só quando
      a subcategoria nunca teve forma de pagamento associada. Teste
      automatizado (supabase/tests/be_ref_02_transaction_shortcuts.test.sql)
      cobre ranking simples, fallback (AC7), os 2 critérios de desempate,
      resolução/exceção de payment_method_id (RN-13) e isolamento cross-user.
      created_via_shortcut é ortogonal a source (DIR-35) — nunca inferir um a
      partir do outro. Sem breaking change nos endpoints já publicados.
  - version: "0.19.0"
    date: "2026-09-04"
    change: >-
      Transaction.account_id sai de `required` em POST/PATCH /transactions
      (BE-REF-04, RF-REF-04 AC1/AC2/AC5; RN-16; DIR-36; ADR-016 Decisão 3/6):
      opcional no payload quando payment_method_id é enviado e kind !=
      transfer — resolvido server-side pelo novo trigger
      transactions_default_account_from_payment_method (forma não-cartão:
      conta vinculada de payment_method_id; forma type=credit_card: conta
      ativa mais antiga do usuário, comportamento já observado hoje,
      preservado — Opção D). Continua obrigatório quando kind=transfer.
      Enviar account_id explicitamente continua aceito e NUNCA é sobrescrito
      pelo servidor (o trigger só atua quando NEW.account_id IS NULL) —
      RecurringTemplate/InstallmentPurchase/FixedBill (Fase 2) continuam
      enviando sempre explícito, inalterados, não acionam o trigger novo.
      Novo 400 em POST/PATCH /transactions quando payment_method_id não
      pertence ao usuário autenticado e account_id foi omitido (checagem
      própria do trigger, independente de RLS, defesa em profundidade —
      ADR-016 Decisão 5). Sem interferência com a resolução de
      card_invoice_id (RN-01/RF-F2-05, ADR-016 Decisão 7) — mecanismos
      totalmente independentes, cobertura de não-regressão em
      supabase/tests/be_ref_04_transactions_default_account.test.sql. Sem
      breaking change nos endpoints já publicados — client que já envia
      account_id explicitamente (comportamento anterior) continua
      funcionando sem nenhuma mudança.
  - version: "0.20.0"
    date: "2026-09-05"
    change: >-
      Adiciona /import_batch, /candidate_transaction,
      /rpc/confirm_candidate_transaction e /rpc/discard_candidate_transaction
      (BE-F3-00, SDD.md Seção 5.2, RNF-01/RNF-08, DIR-20) — modelo de dados de
      captura automatizada compartilhado por voz/foto/importação/Open Finance
      (RF-F3-01/02/03/04), base para BE-F3-01/02/03/04. Nenhum trigger
      promove candidate_transaction a Transaction silenciosamente:
      confirm_candidate_transaction é o ÚNICO caminho (SECURITY DEFINER,
      valida ownership de candidato + de todo FK final antes de criar a
      Transaction e marcar o candidato confirmed, atomicamente).
      candidate_transaction não tem policy de UPDATE para authenticated —
      status só transiciona via confirm_candidate_transaction/
      discard_candidate_transaction. Adiciona Transaction.import_staging_id
      (FK, antes sem constraint) e Transaction.confirmed_at (coluna nova —
      SDD.md Seção 5.1 já a descrevia como existente, auditoria anterior não a
      encontrou no schema real, completada agora). Teste automatizado
      (supabase/tests/be_f3_00_candidate_transaction_import_batch.test.sql)
      cobre isolamento cross-user, 2 vetores de bypass (INSERT já "confirmado"
      e UPDATE direto de status, ambos negados pela RLS), confirmação em
      candidato/FK de outro usuário (403), fluxo legítimo completo, dupla
      confirmação (409), discard + confirmar depois de descartado (409) e
      DELETE restrito a candidato pending. Fora de escopo desta versão
      (propositalmente — ver QA-F3-01): endurecer a policy geral de INSERT de
      /transactions contra `source <> manual` enviado direto pelo client sem
      passar por candidate_transaction. Sem breaking change nos endpoints já
      publicados.
  - version: "0.21.0"
    date: "2026-09-07"
    change: >-
      Adiciona /receipt-ocr (BE-F3-01, RF-F3-02 AC1-3, ADR-007, SPK-002,
      DIR-22) — extração de recibo por OCR atrás da interface própria
      `OCRProvider` (`supabase/functions/_shared/ocrProvider.ts`), vendor
      primário Google Cloud Vision (`DOCUMENT_TEXT_DETECTION`) decidido em
      SPK-002. Não persiste nada — puramente extração, confirmação/persistência
      fica a cargo do fluxo `candidate_transaction` já publicado em 0.20.0.
      Campo obrigatório não extraído retorna em branco sem bloquear os demais
      nem lançar erro (AC3); só falha total do vendor produz erro HTTP (502
      ocr_provider_failed). Corpo em JSON (image_base64/mime_type), chave do
      vendor (GOOGLE_VISION_API_KEY) só no servidor (DIR-30). Ressalva de
      transparência não-bloqueante (mesmo padrão de SPK-002/SEC-DEBT-009):
      integração real implementada, mas sem credencial real nem amostra de
      recibo real disponível nesta sessão para smoke test empírico — ver nota
      de status de BE-F3-01 em TASK.md. Sem breaking change nos endpoints já
      publicados.
  - version: "0.22.0"
    date: "2026-09-07"
    change: >-
      Adiciona /voice-capture (BE-F3-02, RF-F3-01 AC1, ADR-006) — extração de
      campos de captura por voz (valor, data, tipo entrada/saída, descrição
      sugerida, categoria sugerida) a partir da transcrição já produzida pelo
      client via Web Speech API (camada obrigatória de ADR-006, opção B),
      via heurísticas de linguagem natural pt-BR próprias do produto
      (`supabase/functions/voice-capture/lib.ts`). Não persiste nada —
      confirmação/persistência fica a cargo do fluxo `candidate_transaction`
      já publicado em 0.20.0. Todo campo vem marcado com
      `result.suggestion_disclaimer = "sugestão automática, não confirmada"`
      (RF-F3-01 AC1, texto literal). Campo não reconhecido retorna em branco
      sem bloquear os demais nem lançar erro, exceto `transaction_date` que
      assume "hoje" com confiança reduzida na ausência de menção
      (decisão de interpretação documentada em `lib.ts`). Aceita
      alternativamente `audio_base64`/`mime_type` para fallback de STT em
      nuvem, mas ADR-006 decide esse fallback como extensão futura sem vendor
      configurado — responde `503 stt_fallback_not_configured` de forma
      controlada até um novo ADR resolver o vendor
      (`supabase/functions/_shared/sttProvider.ts`). Sem breaking change nos
      endpoints já publicados.
  - version: "0.23.0"
    date: "2026-09-08"
    change: >-
      Adiciona /statement-import (BE-F3-03, RF-F3-03 AC1-3) — interpretação
      de extrato bancário OFX/CSV (`supabase/functions/statement-import/lib.ts`,
      parser OFX por regex tolerante a SGML "solto", parser CSV por nome de
      coluna pt-BR/en) e detecção de possível duplicata (mesma
      transaction_date+amount_cents na account_id informada, contra
      /transactions via RLS do próprio usuário, AC2). Não persiste nada em
      /import_batch nem /candidate_transaction — resposta já vem no formato
      de NewCandidateTransaction (source=import), pronta para o Frontend
      persistir via o mesmo fluxo de candidatos já publicado em 0.20.0
      (FL-05, reuso explícito, não um mecanismo paralelo) depois que o
      usuário revisar/selecionar a lista. Linha malformada isolada é pulada
      (skipped_lines) sem bloquear as demais nem lançar erro; só arquivo sem
      nenhuma transação reconhecível vira 422 unprocessable_file (fallback
      gracioso, provado por supabase/functions/statement-import/lib.test.ts,
      23/23 casos PASS). Sem breaking change nos endpoints já publicados.
  - version: "0.24.0"
    date: "2026-09-09"
    change: >-
      Adiciona /rpc/get_net_worth_evolution (BE-F3-06, RF-F3-05 AC1-2) —
      série temporal do saldo consolidado (mesma fonte de
      get_month_provision/BE-M-07: accounts.current_balance_cents), últimos
      6 meses (mesma janela de get_income_expense_report/BE-F2-10, decisão
      de interpretação pequena, já que RF-F3-05 AC1-2 não fixa
      janela/granularidade), com filtro opcional por p_account_id (AC2).
      Sem tabela nova, sem Edge Function (DIR-33 não se aplica) — só 1 RPC
      SQL SECURITY INVOKER escopada por auth.uid(). Somar a série de cada
      conta individual do usuário reproduz exatamente a série consolidada,
      por construção (AC2, critério de aceite literal), provado em
      supabase/tests/be_f3_06_net_worth_evolution.test.sql (casos A-F: PASS —
      deltas por conta, coerência consolidado x filtro em toda a janela,
      janela de 6 meses, isolamento cross-user). Regressão completa da
      suíte SQL: 31/32 PASS — a única
      falha (be_m07_dashboard.test.sql CASO 2) é pré-existente e não
      relacionada a este lote (BLOCKERS.md Bloqueio 019, dado real de
      produção). Sem breaking change nos endpoints já publicados.
  - version: "0.25.0"
    date: "2026-09-09"
    change: >-
      Adiciona /rpc/get_report_export_rows e /report-export (BE-F3-07,
      RF-F3-06 AC1-2). `DIR-33` checado: nenhuma Edge Function de
      exportação/relatório pré-existente. RPC de leitura (mesma família de
      get_income_expense_report/get_net_worth_evolution) devolve os
      lançamentos do período já com conta/forma de pagamento/categoria
      (topo)/subcategoria resolvidos — inclui kind=transfer (extrato
      completo, diferente do comparativo entradas/saídas). Edge Function
      `report-export` monta o CSV (AC1 — data, conta, forma de pagamento,
      categoria, subcategoria, descrição, tipo, valor) ou o PDF (AC2 —
      resumo do período via npm:pdf-lib: saldo, entradas, saídas,
      distribuição por categoria, kind=transfer excluído do resumo, mesmo
      critério de get_income_expense_report), faz upload ao novo bucket
      privado `exports` (isolamento por pasta <user_id>/..., policy de
      storage.objects) e devolve signed URL de curta duração (300s, SDD.md
      Seção 7/ADR-011, mesmo princípio de G-18) — nenhuma tabela de
      metadado nova, created_at do próprio objeto no Storage já é
      suficiente para a futura BE-F3-08 (expurgo de export >24h) filtrar
      por idade. Teste automatizado: supabase/tests/be_f3_07_report_export.test.sql
      (6 casos via RLS real — categoria/subcategoria nunca invertidas,
      transfer incluído no extrato, filtro de período, isolamento
      cross-user, período vazio — todos PASS) +
      supabase/functions/report-export/lib.test.ts (28/28 casos PASS,
      cobrindo validação de entrada, montagem do CSV e agregação do resumo)
      + supabase/functions/report-export/pdf.test.ts (4/4 casos PASS,
      confirmando por inspeção dos bytes do PDF gerado — via o próprio
      pdf-lib recarregando o arquivo e descomprimindo os content streams
      FlateDecode — que o resumo textual exigido pelo AC2 está de fato
      presente). Regressão completa: supabase/tests/*.sql 33/34 PASS (única
      falha pré-existente e não relacionada, be_m07_dashboard.test.sql CASO
      2, BLOCKERS.md Bloqueio 019); deno test supabase/functions/ 149/149
      PASS (117 pré-existentes + 32 novos). Sem breaking change nos
      endpoints já publicados.
  - version: "0.26.0"
    date: "2026-09-09"
    change: >-
      Adiciona /data-retention-purge (BE-F3-08, ADR-011, DIR-31/32) —
      endpoint interno/operacional, disparado só por pg_cron via pg_net,
      nunca por Frontend/Mobile. `DIR-33` checado: nenhuma Edge Function de
      expurgo/retenção pré-existente. Implementa com confiança total 2 dos 3
      sub-jobs do critério de aceite (candidate_transaction_purge — remove
      CandidateTransaction descartado >30 dias ou pending abandonado >30 dias
      desde a criação do ImportBatch, via nova RPC
      purge_expired_candidate_transactions; export_purge — remove objeto do
      bucket exports/BE-F3-07 criado >24h, via nova RPC
      list_expired_export_objects + Storage API). Ambas as RPCs novas têm
      EXECUTE restrito a service_role (REVOKE de public/anon/authenticated,
      migration 20260909121000) — list_expired_export_objects devolve paths
      com user_id de outros usuários, diferente do padrão sistêmico já aceito
      de cron triggers void (ver SECURITY-REVIEW.md achado sobre
      REVOKE EXECUTE ausente).

      **Achado de lacuna real de especificação, não decidido sozinho pelo
      Backend**: o 3º sub-job (confirmed_receipt_photo_purge, 90 dias após
      confirmed_at) fica sem implementação real — roda todo dia registrado
      como status=skipped_not_implemented no log, nunca fingindo sucesso —
      porque nenhum mecanismo de persistência de foto de recibo existe em
      nenhum lugar do código (receipt-ocr/BE-F3-01 foi implementada sem
      persistir a imagem; a entidade Attachment de SDD.md Seção 5.2 nunca foi
      criada por nenhuma tarefa do TASK.md). Reportado como bloqueio real
      (BLOCKERS.md) para decisão do coordenador/software-architect — desenhar
      essa persistência é uma decisão de arquitetura nova, fora do escopo de
      "job diário de expurgo".

      Log de execução consultável (DIR-32) em nova tabela
      data_retention_purge_log (RLS habilitada, sem policy — deny-all, mesmo
      padrão de backup_export_log/BE-M-10), healthcheck a cada 6h alertando
      por e-mail se candidate_transaction_purge/export_purge ficarem >26h sem
      sucesso. Teste automatizado:
      supabase/tests/be_f3_08_data_retention_purge_jobs.test.sql (7 casos —
      infra/agendamento, trigger/healthcheck fail-safe sem Vault, fronteira
      de retenção nos 2 sentidos para os 3 sub-casos da regra de
      CandidateTransaction — descartado/pending com lote/pending avulso —,
      confirmado com retenção indefinida mesmo após 400 dias, fronteira de
      24h de export com isolamento por bucket — todos PASS) +
      supabase/functions/data-retention-purge/lib.test.ts (8/8 casos PASS).
      Regressão completa: supabase/tests/*.sql 34/35 PASS (única falha
      pré-existente e não relacionada, be_m07_dashboard.test.sql CASO 2,
      BLOCKERS.md Bloqueio 019); deno test supabase/functions/ 157/157 PASS
      (149 pré-existentes + 8 novos). Smoke test real (curl direto):
      X-Cron-Secret ausente/incorreto -> 401 (fail-closed, secret real ainda
      não provisionado — mesma pendência operacional não-bloqueante de
      BACKUP_CRON_SECRET/BE-M-10). Sem breaking change nos endpoints já
      publicados.
  - version: "0.27.0"
    date: "2026-09-09"
    change: >-
      /data-retention-purge (BE-F3-08) — resolução do Bloqueio 024
      (BLOCKERS.md, Resolvido): ADR-020 formalizou que foto de recibo nunca
