  /rpc/confirm_candidate_transaction:
    post:
      summary: "Confirmação humana explícita — ÚNICO caminho para promover um candidato a Transaction real (RF-F3-01/02/03/04 AC, RNF-01, RNF-08, DIR-20)"
      tags: [Captura Automatizada]
      description: >-
        **Novo — BE-F3-00.** Recebe os valores FINAIS do formulário de
        confirmação (já refletindo qualquer edição do usuário sobre os campos
        pré-preenchidos — RF-F3-01 AC3), nunca deriva o lançamento de
        `raw_payload` internamente. Cria a `Transaction`
        (`import_staging_id`=candidato, `confirmed_at`=now(), `source`=o
        mesmo do candidato) e marca o candidato como `confirmed` no mesmo
        `now()`, atomicamente. Todo FK enviado (`p_account_id`/
        `p_payment_method_id`/`p_category_id`/`p_destination_account_id`)
        precisa pertencer ao usuário autenticado — checagem própria dentro da
        função (G-19), já que é `SECURITY DEFINER` e não passa pela RLS normal
        de `/transactions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_candidate_id, p_account_id, p_kind, p_amount_cents, p_transaction_date]
              properties:
                p_candidate_id: { type: string, format: uuid }
                p_account_id: { type: string, format: uuid }
                p_payment_method_id: { type: string, format: uuid, nullable: true, description: "obrigatório quando p_kind != transfer (CHECK de transactions)" }
                p_category_id: { type: string, format: uuid, nullable: true, description: "obrigatório quando p_kind != transfer (CHECK de transactions)" }
                p_kind: { type: string, enum: [income, expense, transfer] }
                p_amount_cents: { type: integer, format: int64, minimum: 1 }
                p_transaction_date: { type: string, format: date }
                p_description: { type: string, nullable: true }
                p_destination_account_id: { type: string, format: uuid, nullable: true, description: "obrigatório e diferente de p_account_id quando p_kind=transfer" }
      responses:
        "200":
          description: "id (uuid) da Transaction criada"
          content: { application/json: { schema: { type: string, format: uuid } } }
        "400": { description: "candidato não encontrado (23503), ou CHECK de transactions violado (23514, ex. payment_method_id/category_id ausente para kind != transfer)" }
        "403":
          description: "candidato pertence a outro usuário, ou algum FK (p_account_id/p_payment_method_id/p_category_id/p_destination_account_id) não pertence ao usuário autenticado (42501)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "candidato não está mais pending — já confirmado ou descartado anteriormente (23001)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /rpc/discard_candidate_transaction:
