<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nova despesa fixa · MyMoney</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-alvo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-esq" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></symbol>
</svg>
<div class="app">
  <nav class="trilho" aria-label="Navegação principal">
    <span class="marca">MyMoney</span>
    <a class="botao-lancar-pc" href="lancar--inicial.html"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg>Lançar</a>
    <ul>
      <li><a href="inicio--sucesso.html" aria-current="page"><svg class="icone" aria-hidden="true"><use href="#i-casa"/></svg>Início</a></li>
      <li><a href="lancamentos--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-lista"/></svg>Lançamentos</a></li>
      <li><a href="orcamento--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-grafico"/></svg>Orçamento</a></li>
      <li><a href="metas--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-alvo"/></svg>Metas</a></li>
      <li><a href="ajustes--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-ajustes"/></svg>Ajustes</a></li>
    </ul>
  </nav>
  <div class="conteudo conteudo-estreito">
    <header class="cabecalho cabecalho-pagina">
      <a class="icone-botao" href="fixas--sucesso.html" aria-label="Voltar para Despesas fixas"><svg class="icone" aria-hidden="true"><use href="#i-esq"/></svg></a>
      <h1 class="titulo-pagina">Nova despesa fixa</h1>
      <span></span>
    </header>
    <main>
      <form class="formulario">
        <div class="campo">
          <label for="descricao">Descrição</label>
          <input id="descricao" class="entrada" type="text" value="" aria-invalid="true" aria-describedby="descricao-erro">
          <p class="campo-erro" id="descricao-erro"><svg class="icone" aria-hidden="true"><use href="#i-alerta"/></svg>Informe a descrição.</p>
        </div>
        <div class="campo"><label for="categoria">Categoria da casa</label><select id="categoria" class="entrada"><option selected>Contas da casa</option><option>Moradia</option><option>Mercado</option><option>Outros da casa</option></select></div>
        <div class="campo campo-valor"><label for="valor">Valor previsto</label><input id="valor" class="entrada" inputmode="numeric" value="R$ 79,90"></div>
        <div class="campo">
          <label for="dia">Dia de vencimento</label>
          <input id="dia" class="entrada" inputmode="numeric" value="32" aria-invalid="true" aria-describedby="dia-erro dia-ajuda">
          <p class="campo-erro" id="dia-erro"><svg class="icone" aria-hidden="true"><use href="#i-alerta"/></svg>Use um dia de 1 a 31.</p>
          <p class="campo-ajuda" id="dia-ajuda">Em meses mais curtos, vale o último dia.</p>
        </div>
        <div class="acoes-formulario"><button class="botao botao-principal" type="submit">Salvar</button></div>
      </form>
    </main>
  </div>
  <nav class="barra-inferior" aria-label="Navegação principal">
    <ul>
      <li><a href="inicio--sucesso.html" aria-current="page"><svg class="icone" aria-hidden="true"><use href="#i-casa"/></svg>Início</a></li>
      <li><a href="lancamentos--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-lista"/></svg>Lançamentos</a></li>
      <li><a href="lancar--inicial.html" class="item-lancar"><span class="botao-lancar"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg></span>Lançar</a></li>
      <li><a href="orcamento--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-grafico"/></svg>Orçamento</a></li>
      <li><a href="metas--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-alvo"/></svg>Metas</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
