<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lançamentos · Outubro de 2026 · MyMoney</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-alvo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-esq" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-dir" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-baixo" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-marcado" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
</svg>

<div class="app">
  <nav class="trilho" aria-label="Navegação principal">
    <span class="marca">MyMoney</span>
    <a class="botao-lancar-pc" href="lancar--inicial.html"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg>Lançar</a>
    <ul>
      <li><a href="inicio--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-casa"/></svg>Início</a></li>
      <li><a href="lancamentos--sucesso.html" aria-current="page"><svg class="icone" aria-hidden="true"><use href="#i-lista"/></svg>Lançamentos</a></li>
      <li><a href="orcamento--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-grafico"/></svg>Orçamento</a></li>
      <li><a href="metas--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-alvo"/></svg>Metas</a></li>
      <li><a href="ajustes--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-ajustes"/></svg>Ajustes</a></li>
    </ul>
  </nav>

  <div class="conteudo">
    <header class="cabecalho">
      <div class="seletor-mes">
        <button class="icone-botao" type="button" aria-label="Mês anterior: setembro de 2026"><svg class="icone" aria-hidden="true"><use href="#i-esq"/></svg></button>
        <h1 class="mes-atual"><span class="visualmente-oculto">Lançamentos de </span>Outubro de 2026</h1>
        <button class="icone-botao" type="button" aria-label="Próximo mês: novembro de 2026"><svg class="icone" aria-hidden="true"><use href="#i-dir"/></svg></button>
      </div>
      <div class="cabecalho-acoes">
        <a class="icone-botao" href="ajustes--sucesso.html" aria-label="Ajustes"><svg class="icone" aria-hidden="true"><use href="#i-ajustes"/></svg></a>
      </div>
    </header>

    <main aria-busy="true">
      <p class="visualmente-oculto" role="status">Carregando os lançamentos…</p>
      <div class="filtros" role="group" aria-label="Filtros">
        <button class="filtro" type="button" aria-pressed="true"><svg class="icone" aria-hidden="true"><use href="#i-marcado"/></svg>Eu</button>
        <button class="filtro" type="button" aria-pressed="false">Casa</button>
        <button class="filtro" type="button" aria-pressed="true"><svg class="icone" aria-hidden="true"><use href="#i-marcado"/></svg>Variável</button>
        <button class="filtro" type="button" aria-haspopup="listbox">Categoria: todas <svg class="icone" aria-hidden="true"><use href="#i-baixo"/></svg></button>
        <button class="filtro" type="button" aria-haspopup="listbox">Forma: todas <svg class="icone" aria-hidden="true"><use href="#i-baixo"/></svg></button>
        <button class="filtro" type="button">Limpar filtros</button>
      </div>
      <div aria-hidden="true">
        <div class="esqueleto esq-valor" style="width:100%;height:48px"></div>
        <div class="esqueleto esq-bloco-titulo"></div>
        <div class="esqueleto esq-linha" style="height:40px"></div>
        <div class="esqueleto esq-linha" style="height:40px"></div>
        <div class="esqueleto esq-bloco-titulo"></div>
        <div class="esqueleto esq-linha" style="height:40px"></div>
        <div class="esqueleto esq-linha" style="height:40px"></div>
        <div class="esqueleto esq-linha" style="height:40px"></div>
      </div>
    </main>
  </div>

  <nav class="barra-inferior" aria-label="Navegação principal">
    <ul>
      <li><a href="inicio--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-casa"/></svg>Início</a></li>
      <li><a href="lancamentos--sucesso.html" aria-current="page"><svg class="icone" aria-hidden="true"><use href="#i-lista"/></svg>Lançamentos</a></li>
      <li><a href="lancar--inicial.html" class="item-lancar"><span class="botao-lancar"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg></span>Lançar</a></li>
      <li><a href="orcamento--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-grafico"/></svg>Orçamento</a></li>
      <li><a href="metas--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-alvo"/></svg>Metas</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
