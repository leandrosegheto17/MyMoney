<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Itaú · Conta · MyMoney</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<!-- Padrão "exclusão em uso" (CA-02.5, CA-03.5, CA-04.5): vale igual para forma e categoria. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-alvo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-esq" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></symbol>
</svg>
<div class="app">
  <nav class="trilho" aria-label="Navegação principal">
    <span class="marca">MyMoney</span>
    <a class="botao-lancar-pc" href="lancar--inicial.html"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg>Lançar</a>
    <ul>
      <li><a href="inicio--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-casa"/></svg>Início</a></li>
      <li><a href="lancamentos--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-lista"/></svg>Lançamentos</a></li>
      <li><a href="orcamento--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-grafico"/></svg>Orçamento</a></li>
      <li><a href="metas--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-alvo"/></svg>Metas</a></li>
      <li><a href="ajustes--sucesso.html" aria-current="page"><svg class="icone" aria-hidden="true"><use href="#i-ajustes"/></svg>Ajustes</a></li>
    </ul>
  </nav>
  <div class="conteudo conteudo-estreito">
    <header class="cabecalho cabecalho-pagina">
      <a class="icone-botao" href="contas--sucesso.html" aria-label="Voltar para Contas"><svg class="icone" aria-hidden="true"><use href="#i-esq"/></svg></a>
      <h1 class="titulo-pagina">Conta</h1>
      <span></span>
    </header>
    <main>
      <div class="aviso-erro-topo" role="alert" style="margin-top:var(--espaco-3)">
        <svg class="icone" aria-hidden="true"><use href="#i-alerta"/></svg>
        <span>Esta conta tem lançamentos ou formas de pagamento ligados a ela. Arquive para tirá-la das opções; o histórico continua.</span>
      </div>
      <form class="formulario">
        <div class="campo"><label for="nome">Nome</label><input id="nome" class="entrada" type="text" value="Itaú"></div>
        <div class="campo campo-valor"><label for="saldo-inicial">Saldo inicial</label><input id="saldo-inicial" class="entrada" inputmode="numeric" value="R$ 800,00"></div>
        <div class="acoes-formulario">
          <button class="botao botao-principal" type="button">Arquivar conta</button>
          <a class="botao botao-secundario" href="conta--sucesso.html">Cancelar</a>
        </div>
      </form>
    </main>
  </div>
  <nav class="barra-inferior" aria-label="Navegação principal">
    <ul>
      <li><a href="inicio--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-casa"/></svg>Início</a></li>
      <li><a href="lancamentos--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-lista"/></svg>Lançamentos</a></li>
      <li><a href="lancar--inicial.html" class="item-lancar"><span class="botao-lancar"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg></span>Lançar</a></li>
      <li><a href="orcamento--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-grafico"/></svg>Orçamento</a></li>
      <li><a href="metas--sucesso.html"><svg class="icone" aria-hidden="true"><use href="#i-alvo"/></svg>Metas</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
