<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-ajustes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-alvo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<div class="app">
  <nav class="trilho" aria-label="Navegação principal">
    <span class="marca">MyMoney</span>
    <a class="botao-lancar-pc" href="lancar--inicial.html"><svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg>Lançar</a>

<div class="veu" aria-hidden="true"></div>
<section class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
  <div class="folha-alca" aria-hidden="true"></div>
  <div class="folha-topo">
    <h2 id="folha-titulo">Pagamento do cartão</h2>
    <a class="icone-botao" href="forma--sucesso.html" aria-label="Fechar"><svg class="icone" aria-hidden="true"><use href="#i-fechar"/></svg></a>
  </div>
  <form class="folha-corpo" id="form-pagto">
    <p class="item-sub"><span class="item-titulo" style="color:var(--cor-texto)">Cartão de crédito XP</span>· vence dia 10</p>
    <div class="campo campo-valor"><label for="valor">Valor pago</label><input id="valor" class="entrada" inputmode="numeric" value="R$ 0,00"></div>
    <div class="campo"><label for="conta">Conta de origem</label><select id="conta" class="entrada"><option selected>Itaú</option><option>Nubank</option></select></div>
    <div class="campo"><label for="data">Data</label><input id="data" class="entrada" type="date" value="2026-10-09"></div>
    <p class="nota">Sai do saldo da conta. Não conta como despesa em nenhum total, porque as compras já contaram.</p>
  </form>
  <div class="folha-rodape"><button class="botao botao-principal" type="submit" form="form-pagto">Registrar pagamento</button></div>
</section>
